<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cuaderno" />
<meta name="theme-color" content="#f5efe1" />
<title>Cuaderno Personal</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.png" />
<style>
  :root{
    --paper:#f7f1e3;
    --paper-line:#e6dcc4;
    --ink:#2b2b2b;
    --ink-soft:#6b6b6b;
    --accent:#b5451f;
    --accent-soft:#e8b48a;
    --important:#c9762a;
    --done:#9aa79a;
    --shadow:0 2px 10px rgba(0,0,0,.06);
    --radius:14px;
    --bg:#efe7d4;
  }
  [data-theme="dark"]{
    --paper:#1f1e1c;
    --paper-line:#2e2c28;
    --ink:#ece7db;
    --ink-soft:#a8a397;
    --accent:#e08b5b;
    --accent-soft:#6a3f28;
    --important:#e0a25b;
    --done:#5c615a;
    --shadow:0 2px 10px rgba(0,0,0,.4);
    --bg:#151412;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);
    overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
    padding-top:env(safe-area-inset-top);
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--paper);
    display:flex;flex-direction:column;position:relative}

  /* ---------- Selector de cuaderno ---------- */
  .notebooks{
    display:flex;gap:8px;padding:10px 14px 8px;
    background:var(--paper);border-bottom:1px solid var(--paper-line);
    position:sticky;top:0;z-index:30;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  .nb-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 8px;border-radius:12px;border:1.5px solid var(--paper-line);
    background:var(--bg);color:var(--ink-soft);font-size:14px;font-weight:600;
    cursor:pointer;transition:.15s;
  }
  .nb-btn.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
    box-shadow:0 3px 10px rgba(0,0,0,.12);
  }
  .nb-btn .em{font-size:18px;line-height:1}

  /* ---------- Header ---------- */
  header{background:var(--paper);border-bottom:1px solid var(--paper-line);padding:10px 14px 8px;
    position:sticky;top:0;z-index:20}
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .daynav{display:flex;align-items:center;gap:4px;flex:1}
  .daynav button{background:transparent;border:none;color:var(--ink);
    font-size:22px;padding:6px 10px;border-radius:10px;cursor:pointer}
  .daynav button:active{background:var(--paper-line)}
  .daytitle{font-size:17px;font-weight:600;letter-spacing:.4px;text-transform:capitalize;
    flex:1;text-align:center;line-height:1.15}
  .daytitle small{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);
    letter-spacing:.8px;text-transform:uppercase;margin-top:2px}
  .todaybtn{background:var(--accent);color:#fff;border:none;border-radius:20px;
    padding:6px 12px;font-size:12px;font-weight:600;letter-spacing:.5px;cursor:pointer}
  .iconbtn{background:transparent;border:none;color:var(--ink);font-size:20px;
    padding:6px 8px;border-radius:10px;cursor:pointer}
  .iconbtn:active{background:var(--paper-line)}

  /* ---------- Header familiar (grande) ---------- */
  .fam-header{padding:18px 18px 14px;background:var(--paper);
    border-bottom:1px solid var(--paper-line);position:sticky;top:0;z-index:20}
  .fam-hello{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:4px}
  .fam-date{font-size:17px;color:var(--ink-soft);text-transform:capitalize;margin-bottom:10px}
  .fam-daynav{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .fam-daynav button{
    background:var(--bg);border:1.5px solid var(--paper-line);border-radius:14px;
    padding:12px 20px;font-size:22px;color:var(--ink);cursor:pointer;font-weight:700;
    min-width:64px;
  }
  .fam-daynav .fam-day-label{
    flex:1;text-align:center;font-size:19px;font-weight:700;
    background:var(--accent-soft);padding:12px 8px;border-radius:14px;
  }
  .fam-daynav .fam-day-label.home{background:var(--accent);color:#fff}
  .fam-settings-row{display:flex;justify-content:flex-end;margin-top:8px}
  .fam-settings-row button{
    background:transparent;border:none;color:var(--ink-soft);font-size:14px;
    padding:6px 10px;border-radius:10px;cursor:pointer;
  }

  /* ---------- Main ---------- */
  main{flex:1;padding:12px 14px 140px}
  main.fam{padding:14px 14px 160px}
  .section-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;margin:14px 4px 8px;display:flex;align-items:center;gap:6px}
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:50px 20px;line-height:1.6}
  .empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}
  main.fam .empty{font-size:17px;padding:60px 24px}

  /* ---------- Tarjeta trabajo ---------- */
  .card{background:var(--paper);border:1px solid var(--paper-line);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;
    box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;
    touch-action:manipulation;transition:transform .12s,opacity .12s;position:relative}
  .card.done{opacity:.5}
  .card.done .ctitle{text-decoration:line-through}
  .card.important{border-left:4px solid var(--important)}
  .card.dragging{opacity:.4;transform:scale(.98)}
  .check{flex:0 0 24px;width:24px;height:24px;border:2px solid var(--ink-soft);
    border-radius:6px;margin-top:2px;cursor:pointer;position:relative;background:transparent}
  .check.on{background:var(--done);border-color:var(--done)}
  .check.on::after{content:"✓";color:#fff;font-size:15px;position:absolute;
    left:4px;top:-1px;font-weight:700}
  .cbody{flex:1;min-width:0}
  .ctitle{font-size:15px;font-weight:600;line-height:1.3;word-wrap:break-word}
  .ctext{font-size:13.5px;color:var(--ink-soft);margin-top:3px;
    white-space:pre-wrap;word-wrap:break-word;line-height:1.4}
  .cmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    margin-top:6px;font-size:11.5px;color:var(--ink-soft)}
  .tag{background:var(--paper-line);padding:2px 8px;border-radius:10px;
    font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;font-weight:600}
  .tag.prio-high{background:#f7d0c0;color:#8a2d10}
  .tag.prio-med{background:#f6e4c2;color:#7a5410}
  .tag.prio-low{background:#d8e6d6;color:#3a5a3a}
  [data-theme="dark"] .tag.prio-high{background:#5a2a1a;color:#ffcbb4}
  [data-theme="dark"] .tag.prio-med{background:#5a4520;color:#ffdca1}
  [data-theme="dark"] .tag.prio-low{background:#2f4a2f;color:#c8e0c8}
  .card .star{background:transparent;border:none;font-size:18px;cursor:pointer;
    color:var(--ink-soft);padding:0 2px}
  .card .star.on{color:var(--important)}
  .card .more{background:transparent;border:none;font-size:18px;cursor:pointer;
    color:var(--ink-soft);padding:0 4px}

  /* ---------- Tarjeta familiar (grande y clara) ---------- */
  .fam-card{
    background:var(--paper);
    border:1.5px solid var(--paper-line);
    border-radius:18px;
    padding:16px 16px 14px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
    display:flex;gap:12px;align-items:flex-start;
    position:relative;
    transition:opacity .15s;
  }
  .fam-card.done{opacity:.5}
  .fam-card.done .fam-title{text-decoration:line-through}
  .fam-card.cat-medicacion{border-left:5px solid #e07a7a;background:linear-gradient(to right,#fff6f6 0%,var(--paper) 60%)}
  .fam-card.cat-medico{border-left:5px solid #6a9ee0;background:linear-gradient(to right,#f3f8ff 0%,var(--paper) 60%)}
  .fam-card.cat-compras{border-left:5px solid #7ab97a;background:linear-gradient(to right,#f4fbf4 0%,var(--paper) 60%)}
  .fam-card.cat-peluqueria{border-left:5px solid #c77ac7;background:linear-gradient(to right,#fdf5fd 0%,var(--paper) 60%)}
  .fam-card.cat-llamadas{border-left:5px solid #e0b06a;background:linear-gradient(to right,#fffaf0 0%,var(--paper) 60%)}
  .fam-card.cat-tramites{border-left:5px solid #9c9cc7;background:linear-gradient(to right,#f7f7ff 0%,var(--paper) 60%)}
  .fam-card.cat-casa{border-left:5px solid #b08d6a;background:linear-gradient(to right,#fbf6f0 0%,var(--paper) 60%)}
  [data-theme="dark"] .fam-card.cat-medicacion,
  [data-theme="dark"] .fam-card.cat-medico,
  [data-theme="dark"] .fam-card.cat-compras,
  [data-theme="dark"] .fam-card.cat-peluqueria,
  [data-theme="dark"] .fam-card.cat-llamadas,
  [data-theme="dark"] .fam-card.cat-tramites,
  [data-theme="dark"] .fam-card.cat-casa{background:var(--paper)}

  .fam-check{
    flex:0 0 34px;width:34px;height:34px;border:3px solid var(--ink-soft);
    border-radius:10px;margin-top:2px;cursor:pointer;position:relative;background:transparent;
  }
  .fam-check.on{background:var(--done);border-color:var(--done)}
  .fam-check.on::after{
    content:"✓";color:#fff;font-size:20px;position:absolute;
    left:6px;top:-2px;font-weight:800;
  }
  .fam-body{flex:1;min-width:0}
  .fam-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
  .fam-emoji{font-size:30px;line-height:1}
  .fam-cat-label{
    font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--ink-soft);font-weight:700;margin-top:6px;
  }
  .fam-hour{
    font-size:24px;font-weight:800;color:var(--accent);
    letter-spacing:-.5px;line-height:1;margin-left:auto;white-space:nowrap;
  }
  .fam-title{font-size:20px;font-weight:700;line-height:1.25;margin-bottom:6px}
  .fam-text{font-size:16px;color:var(--ink-soft);line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .fam-line{
    display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-soft);
    margin-top:8px;line-height:1.35;
  }
  .fam-line .em{font-size:18px}
  .fam-line strong{color:var(--ink);font-weight:600}
  .fam-alert{
    display:flex;align-items:center;gap:8px;
    background:#fff4dc;border:1px solid #f0d6a8;
    padding:8px 12px;border-radius:10px;margin-top:10px;
    font-size:14px;color:#7a5410;font-weight:600;
  }
  [data-theme="dark"] .fam-alert{background:#3a2e18;border-color:#5a4520;color:#ffdca1}
  .fam-actions{
    display:flex;gap:8px;margin-top:12px;border-top:1px dashed var(--paper-line);padding-top:10px;
  }
  .fam-actions button{
    flex:1;background:var(--bg);border:1px solid var(--paper-line);
    border-radius:10px;padding:10px 8px;font-size:14px;font-weight:600;
    color:var(--ink);cursor:pointer;font-family:inherit;
  }
  .fam-actions button:active{background:var(--paper-line)}

  /* ---------- Resumen familiar ---------- */
  .fam-summary{
    display:flex;gap:8px;margin:4px 0 14px;
  }
  .fam-summary .box{
    flex:1;background:var(--bg);border:1px solid var(--paper-line);
    border-radius:14px;padding:12px 10px;text-align:center;
  }
  .fam-summary .num{font-size:26px;font-weight:800;color:var(--accent);line-height:1}
  .fam-summary .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;
    color:var(--ink-soft);font-weight:700;margin-top:4px}

  /* ---------- Secciones desplegables (familiar) ---------- */
  .fam-fold{
    background:var(--bg);border:1px solid var(--paper-line);border-radius:14px;
    margin-bottom:14px;overflow:hidden;
  }
  .fam-fold>summary{
    list-style:none;cursor:pointer;padding:14px 16px;
    display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;
    color:var(--ink);
  }
  .fam-fold>summary::-webkit-details-marker{display:none}
  .fam-fold>summary .arrow{
    margin-left:auto;transition:transform .2s;color:var(--ink-soft);font-size:14px;
  }
  .fam-fold[open]>summary .arrow{transform:rotate(90deg)}
  .fam-fold>summary .badge{
    background:var(--accent);color:#fff;border-radius:12px;
    padding:2px 10px;font-size:13px;font-weight:700;
  }
  .fam-fold>summary .badge.warn{background:#c9762a}
  .fam-fold>summary .badge.ok{background:var(--done)}
  .fam-fold-body{padding:0 10px 10px}

  /* ---------- FAB ---------- */
  .fab{position:fixed;right:calc(50% - 320px + 20px);bottom:calc(30px + env(safe-area-inset-bottom));
    width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;
    border:none;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(180,70,30,.35);
    cursor:pointer;z-index:30;display:flex;align-items:center;justify-content:center}
  @media(max-width:680px){.fab{right:20px}}
  .fab:active{transform:scale(.94)}
  body[data-notebook="familiar"] .fab{width:70px;height:70px;font-size:36px;bottom:calc(36px + env(safe-area-inset-bottom))}

  /* ---------- Tabs ---------- */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
    border-top:1px solid var(--paper-line);display:flex;justify-content:space-around;
    align-items:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));
    z-index:25;max-width:640px;margin:0 auto}
  nav.tabs button{background:transparent;border:none;color:var(--ink-soft);
    font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:4px 8px;border-radius:10px;cursor:pointer;font-weight:500}
  nav.tabs button .ico{font-size:19px;line-height:1}
  nav.tabs button.active{color:var(--accent)}
  body[data-notebook="familiar"] nav.tabs button{font-size:11.5px}
  body[data-notebook="familiar"] nav.tabs button .ico{font-size:22px}

  /* ---------- Sheet ---------- */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;
    display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex}
  .sheet{background:var(--paper);width:100%;max-width:640px;
    border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    max-height:92vh;overflow-y:auto;box-shadow:0 -6px 30px rgba(0,0,0,.2);
    animation:slideup .22s ease-out}
  @keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet h3{margin:0 0 12px;font-size:16px;font-weight:600}
  body[data-notebook="familiar"] .sheet h3{font-size:19px}
  .sheet input[type=text],.sheet textarea,.sheet input[type=date],.sheet input[type=time],.sheet select{
    width:100%;padding:11px 12px;border:1px solid var(--paper-line);border-radius:10px;
    font-size:15px;font-family:inherit;background:var(--bg);color:var(--ink);margin-bottom:10px;
    -webkit-appearance:none;appearance:none}
  body[data-notebook="familiar"] .sheet input[type=text],
  body[data-notebook="familiar"] .sheet textarea,
  body[data-notebook="familiar"] .sheet input[type=date],
  body[data-notebook="familiar"] .sheet input[type=time],
  body[data-notebook="familiar"] .sheet select{font-size:17px;padding:14px 12px}
  .sheet textarea{min-height:90px;resize:vertical}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{padding:7px 12px;border-radius:16px;border:1px solid var(--paper-line);
    background:var(--bg);font-size:13px;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  body[data-notebook="familiar"] .chip{font-size:15px;padding:12px 16px;border-radius:14px}
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
  .cat-btn{
    display:flex;align-items:center;gap:8px;padding:14px 12px;
    border:2px solid var(--paper-line);border-radius:14px;background:var(--bg);
    font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;
    text-align:left;
  }
  .cat-btn .em{font-size:22px}
  .cat-btn.on{border-color:var(--accent);background:var(--accent-soft);color:#fff}
  .cat-btn.on .em{filter:brightness(1.2)}
  .sheet .actions{display:flex;gap:8px;margin-top:8px}
  .sheet .actions button{flex:1;padding:12px;border-radius:12px;border:none;
    font-size:15px;font-weight:600;cursor:pointer}
  body[data-notebook="familiar"] .sheet .actions button{font-size:17px;padding:16px}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:var(--bg);color:var(--ink);border:1px solid var(--paper-line)!important}
  .label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);
    font-weight:600;margin:2px 2px 6px}
  body[data-notebook="familiar"] .label{font-size:13px}
  .moveopt{display:block;width:100%;text-align:left;padding:14px 12px;background:var(--bg);
    border:1px solid var(--paper-line);border-radius:12px;margin-bottom:8px;font-size:15px;
    color:var(--ink);cursor:pointer;font-family:inherit}
  .moveopt:active{background:var(--paper-line)}
  body[data-notebook="familiar"] .moveopt{font-size:17px;padding:18px 14px}

  /* ---------- Calendario ---------- */
  .cal{padding:8px 12px 110px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 12px}
  .cal-head button{background:transparent;border:none;font-size:20px;padding:6px 12px;cursor:pointer;color:var(--ink)}
  .cal-head .mtitle{font-size:16px;font-weight:600;text-transform:capitalize}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-grid .wd{font-size:11px;text-align:center;color:var(--ink-soft);padding:4px 0;font-weight:600}
  .cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:12px;cursor:pointer;position:relative;font-size:14px;
    border:1px solid transparent;color:var(--ink);background:transparent}
  .cal-cell.muted{color:var(--ink-soft);opacity:.35}
  .cal-cell.today{background:var(--accent-soft);font-weight:700}
  .cal-cell.selected{border-color:var(--accent);font-weight:700}
  .cal-cell .dots{display:flex;gap:2px;margin-top:3px;position:absolute;bottom:6px}
  .cal-cell .dot{width:4px;height:4px;border-radius:50%;background:var(--accent)}
  .cal-cell .dot.imp{background:var(--important)}
  .cal-cell .dot.done{background:var(--done)}
  body[data-notebook="familiar"] .cal-cell{font-size:17px}
  body[data-notebook="familiar"] .cal-head .mtitle{font-size:19px}

  .searchbox{padding:10px 14px}
  .searchbox input{width:100%;padding:12px 14px;border-radius:14px;
    border:1px solid var(--paper-line);background:var(--bg);color:var(--ink);
    font-size:16px;font-family:inherit}
  body[data-notebook="familiar"] .searchbox input{font-size:17px;padding:14px}

  .toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));
    transform:translateX(-50%);background:#2b2b2b;color:#fff;
    padding:10px 18px;border-radius:20px;font-size:14px;z-index:60;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  body[data-notebook="familiar"] .toast{font-size:16px;padding:14px 22px}

  .settings{padding:16px 16px 130px}
  .settings h3{font-size:14px;letter-spacing:1px;text-transform:uppercase;
    color:var(--ink-soft);margin:22px 4px 10px}
  .settings .opt{display:flex;align-items:center;justify-content:space-between;
    padding:14px;background:var(--bg);border:1px solid var(--paper-line);
    border-radius:12px;margin-bottom:8px;font-size:15px;cursor:pointer}
  .settings .opt small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px}
  body[data-notebook="familiar"] .settings .opt{font-size:17px;padding:16px}
  .switch{width:46px;height:28px;border-radius:14px;background:#bbb;
    position:relative;transition:.2s;flex:0 0 auto}
  .switch.on{background:var(--accent)}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
    border-radius:50%;background:#fff;transition:.2s}
  .switch.on::after{left:21px}
</style>
</head>
<body data-notebook="trabajo">
<div id="app">

  <div class="notebooks" id="notebooks">
    <button class="nb-btn" data-nb="trabajo"><span class="em">📘</span> Trabajo</button>
    <button class="nb-btn" data-nb="familiar"><span class="em">🏠</span> Familia</button>
  </div>

  <header id="header"></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
  <button class="fab" id="fab" aria-label="Nueva anotación">+</button>
  <div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* =========================================================
   CUADERNO PERSONAL — Trabajo + Familia (v3)
   ========================================================= */

const STORE_KEY='cuaderno.v2'; // ← MISMA CLAVE. Los datos actuales se conservan.
const THEME_KEY='cuaderno.theme';
const NOTEBOOK_KEY='cuaderno.notebook';
const NAME_KEY='cuaderno.famName';

const CATEGORIAS_FAMILIA=[
  {id:'medicacion', emoji:'💊', label:'Medicación', tipo:'PASTILLA'},
  {id:'medico',     emoji:'🩺', label:'Médico',     tipo:'MÉDICO'},
  {id:'compras',    emoji:'🛒', label:'Compras',    tipo:'COMPRAS'},
  {id:'peluqueria', emoji:'💇', label:'Peluquería', tipo:'PELUQUERÍA'},
  {id:'llamadas',   emoji:'📞', label:'Llamadas',   tipo:'LLAMADAS'},
  {id:'tramites',   emoji:'📄', label:'Trámites',   tipo:'TRÁMITES'},
  {id:'casa',       emoji:'🏠', label:'Casa',       tipo:'CASA'},
  {id:'otros',      emoji:'📌', label:'Otros',      tipo:'OTROS'}
];

let state={
  notebooks:{
    trabajo:{notes:[]},
    familiar:{notes:[]}
  },
  theme: localStorage.getItem(THEME_KEY)||'light',
  currentNotebook: localStorage.getItem(NOTEBOOK_KEY)||'trabajo',
  famName: localStorage.getItem(NAME_KEY)||''
};
let currentDate=todayISO();
let currentTab='hoy';
let calMonth=new Date();
let searchQuery='';

/* ---------- Fechas ---------- */
function todayISO(){return toISO(new Date());}
function toISO(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return toISO(d);}
function fmtLong(iso){
  const d=parseISO(iso);
  const wd=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()];
  const mn=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()];
  return `${wd} ${d.getDate()} de ${mn}`;
}
function fmtShort(iso){const d=parseISO(iso);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;}
function nextWeekday(target){const d=new Date();const cur=d.getDay()===0?7:d.getDay();let diff=(target-cur+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return toISO(d);}
function greeting(){
  const h=new Date().getHours();
  let g;
  if(h<6)g='Buenas noches';
  else if(h<13)g='Buenos días';
  else if(h<20)g='Buenas tardes';
  else g='Buenas noches';
  return state.famName ? `${g}, ${state.famName}` : g;
}

/* ---------- Persistencia ---------- */
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const p=JSON.parse(raw);
      if(p && p.notebooks){
        if(Array.isArray(p.notebooks.trabajo?.notes)) state.notebooks.trabajo.notes=p.notebooks.trabajo.notes;
        if(Array.isArray(p.notebooks.familiar?.notes)) state.notebooks.familiar.notes=p.notebooks.familiar.notes;
      }
    }
  }catch(e){console.warn('load error',e);}
}
function save(){
  try{localStorage.setItem(STORE_KEY, JSON.stringify({notebooks:state.notebooks}));}
  catch(e){toast('No se pudo guardar');}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function notes(){return state.notebooks[state.currentNotebook].notes;}
function setNotes(arr){state.notebooks[state.currentNotebook].notes=arr;}

/* ---------- Tema ---------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  document.body.setAttribute('data-notebook', state.currentNotebook);
  const meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', state.theme==='dark'?'#151412':'#f5efe1');
}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem(THEME_KEY,state.theme);applyTheme();render();}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- Cambio de cuaderno ---------- */
function switchNotebook(nb){
  if(nb!==state.currentNotebook){
    state.currentNotebook=nb;
    localStorage.setItem(NOTEBOOK_KEY,nb);
    currentTab='hoy';
    currentDate=todayISO();
    searchQuery='';
    applyTheme();
    render();
    toast(nb==='trabajo'?'📘 Cuaderno de Trabajo':'🏠 Cuaderno Familiar');
  }
}

/* ---------- CRUD ---------- */
function addNote(n){
  const note={
    id:uid(),
    title:n.title||'',
    text:n.text||'',
    date:n.date||todayISO(),
    time:n.time||'',
    priority:n.priority||'',
    category:n.category||'',
    place:n.place||'',
    alert:n.alert||'',
    dose:n.dose||'',
    important:!!n.important,
    done:false,
    repeat:n.repeat||'',
    createdAt:Date.now()
  };
  notes().push(note);save();render();
  return note;
}
function updateNote(id,patch){
  const n=notes().find(x=>x.id===id);if(!n)return;
  Object.assign(n,patch);save();
}
function deleteNote(id){setNotes(notes().filter(n=>n.id!==id));save();render();}
function duplicateNote(id){
  const n=notes().find(x=>x.id===id);if(!n)return;
  const copy={...n,id:uid(),done:false,createdAt:Date.now()};
  notes().push(copy);save();render();toast('Duplicada');
}
function toggleDone(id){
  const n=notes().find(x=>x.id===id);if(!n)return;
  n.done=!n.done;
  if(n.done && n.repeat){
    const next=nextRepeat(n.date,n.repeat);
    if(next){notes().push({...n,id:uid(),done:false,date:next,createdAt:Date.now()});}
  }
  save();render();
}
function nextRepeat(iso,type){
  const d=parseISO(iso);
  if(type==='daily'){d.setDate(d.getDate()+1);return toISO(d);}
  if(type==='weekly'){d.setDate(d.getDate()+7);return toISO(d);}
  if(type==='monthly'){d.setMonth(d.getMonth()+1);return toISO(d);}
  return null;
}
function moveNote(id,newDate){
  const n=notes().find(x=>x.id===id);if(!n)return;
  n.date=newDate;save();render();toast('Movida a '+fmtShort(newDate));
}
function toggleImportant(id){
  const n=notes().find(x=>x.id===id);if(!n)return;
  n.important=!n.important;save();render();
}
function notesForDate(iso){
  return notes().filter(n=>n.date===iso).sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    if(a.important!==b.important)return a.important?-1:1;
    const p={high:0,med:1,low:2,'':3};
    if(p[a.priority]!==p[b.priority])return p[a.priority]-p[b.priority];
    if(a.time&&b.time)return a.time.localeCompare(b.time);
    if(a.time)return -1;if(b.time)return 1;
    return a.createdAt-b.createdAt;
  });
}
function lateNotes(){const t=todayISO();return notes().filter(n=>!n.done&&n.date<t);}
function catInfo(id){return CATEGORIAS_FAMILIA.find(c=>c.id===id)||CATEGORIAS_FAMILIA[CATEGORIAS_FAMILIA.length-1];}

/* ---------- Render principal ---------- */
function render(){
  applyTheme();
  document.querySelectorAll('.nb-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.nb===state.currentNotebook);
    b.onclick=()=>switchNotebook(b.dataset.nb);
  });

  const header=document.getElementById('header');
  const main=document.getElementById('main');
  const tabs=document.getElementById('tabs');
  const fab=document.getElementById('fab');

  const esFam = state.currentNotebook==='familiar';
  main.classList.toggle('fam', esFam);

  const tabDefs=[
    {id:'hoy',ico:'📅',label:'Hoy'},
    {id:'calendario',ico:'📆',label:'Calendario'},
    {id:'notas',ico:'📝',label:'Notas'},
    {id:'importantes',ico:'⭐',label: esFam?'Importantes':'Importantes'},
    {id:'pendientes',ico:'📌',label: esFam?'Pendientes':'Pendientes'},
    {id:'buscar',ico:'🔎',label:'Buscar'},
  ];
  tabs.innerHTML=tabDefs.map(t=>
    `<button data-tab="${t.id}" class="${currentTab===t.id?'active':''}">
       <span class="ico">${t.ico}</span>${t.label}
     </button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    currentTab=b.dataset.tab;
    if(currentTab==='calendario'){calMonth=new Date();}
    if(currentTab==='buscar'){searchQuery='';}
    render();
  });

  if(currentTab==='hoy'){
    if(esFam){ renderFamHeader(header); fab.style.display='flex'; renderFamDay(main); }
    else { renderWorkHeader(header); fab.style.display='flex'; renderDay(main); }
  } else if(currentTab==='calendario'){
    if(esFam){
      header.innerHTML=`<div class="fam-header"><div class="fam-hello">Calendario</div><div class="fam-date">Toca un día para abrirlo</div><div class="fam-settings-row"><button id="settings">⚙︎ Ajustes</button></div></div>`;
    } else {
      header.innerHTML=`<div class="toprow"><div class="daytitle" style="text-align:left">Calendario<small>toca un día para abrirlo</small></div><button class="iconbtn" id="settings">⚙︎</button></div>`;
    }
    header.querySelector('#settings').onclick=openSettings;
    fab.style.display='flex';
    renderCalendar(main);
  } else if(currentTab==='notas'){
    if(esFam){
      header.innerHTML=`<div class="fam-header"><div class="fam-hello">Notas</div><div class="fam-date">Todas las anotaciones</div><div class="fam-settings-row"><button id="settings">⚙︎ Ajustes</button></div></div>`;
    } else {
      header.innerHTML=`<div class="toprow"><div class="daytitle" style="text-align:left">Notas<small>todas las anotaciones</small></div><button class="iconbtn" id="settings">⚙︎</button></div>`;
    }
    header.querySelector('#settings').onclick=openSettings;
    fab.style.display='flex';
    renderAllNotes(main);
  } else if(currentTab==='importantes'){
    if(esFam){
      header.innerHTML=`<div class="fam-header"><div class="fam-hello">Importantes</div><div class="fam-date">Marcadas con ⭐</div><div class="fam-settings-row"><button id="settings">⚙︎ Ajustes</button></div></div>`;
    } else {
      header.innerHTML=`<div class="toprow"><div class="daytitle" style="text-align:left">Importantes<small>marcadas con ⭐</small></div><button class="iconbtn" id="settings">⚙︎</button></div>`;
    }
    header.querySelector('#settings').onclick=openSettings;
    fab.style.display='flex';
    renderImportantes(main);
  } else if(currentTab==='pendientes'){
    if(esFam){
      header.innerHTML=`<div class="fam-header"><div class="fam-hello">Pendientes</div><div class="fam-date">Sin completar</div><div class="fam-settings-row"><button id="settings">⚙︎ Ajustes</button></div></div>`;
    } else {
      header.innerHTML=`<div class="toprow"><div class="daytitle" style="text-align:left">Pendientes<small>sin completar</small></div><button class="iconbtn" id="settings">⚙︎</button></div>`;
    }
    header.querySelector('#settings').onclick=openSettings;
    fab.style.display='flex';
    renderPendientes(main);
  } else if(currentTab==='buscar'){
    if(esFam){
      header.innerHTML=`<div class="fam-header"><div class="fam-hello">Buscar</div><div class="fam-date">En título, texto, lugar…</div><div class="fam-settings-row"><button id="settings">⚙︎ Ajustes</button></div></div>`;
    } else {
      header.innerHTML=`<div class="toprow"><div class="daytitle" style="text-align:left">Buscar<small>en título, texto, categoría, lugar</small></div><button class="iconbtn" id="settings">⚙︎</button></div>`;
    }
    header.querySelector('#settings').onclick=openSettings;
    fab.style.display='none';
    renderBuscar(main);
  }

  if(currentTab==='hoy' && !esFam){
    const late=lateNotes();
    if(late.length){
      const banner=document.createElement('div');
      banner.className='late';
      banner.innerHTML=`<span>⚠︎ ${late.length} pendiente${late.length>1?'s':''} de días anteriores</span><button id="seelate">Ver</button>`;
      main.insertBefore(banner,main.firstChild);
      banner.querySelector('#seelate').onclick=()=>{currentTab='pendientes';render();};
    }
  }

  fab.onclick=()=>openEditor(null, currentTab==='hoy'?currentDate:todayISO());
}

function isToday(iso){return iso===todayISO();}

/* ---------- Header trabajo ---------- */
function renderWorkHeader(header){
  header.innerHTML=`
    <div class="toprow">
      <div class="daynav">
        <button id="prev">‹</button>
        <div class="daytitle">
          ${isToday(currentDate)?'Hoy':''}
          <span style="display:block">${fmtLong(currentDate)}</span>
          <small>${parseISO(currentDate).getFullYear()}</small>
        </div>
        <button id="next">›</button>
      </div>
      <div style="display:flex;gap:2px;align-items:center">
        <button class="todaybtn" id="goToday">HOY</button>
        <button class="iconbtn" id="settings">⚙︎</button>
      </div>
    </div>`;
  header.querySelector('#prev').onclick=()=>{currentDate=addDays(currentDate,-1);render();};
  header.querySelector('#next').onclick=()=>{currentDate=addDays(currentDate,1);render();};
  header.querySelector('#goToday').onclick=()=>{currentDate=todayISO();render();};
  header.querySelector('#settings').onclick=openSettings;
}

/* ---------- Header familiar (grande) ---------- */
function renderFamHeader(header){
  const esHoy = isToday(currentDate);
  header.innerHTML=`
    <div class="fam-hello">${greeting()}</div>
    <div class="fam-date">${fmtLong(currentDate)} · ${parseISO(currentDate).getFullYear()}</div>
    <div class="fam-daynav">
      <button id="prev">‹</button>
      <div class="fam-day-label ${esHoy?'home':''}" id="goToday">${esHoy?'HOY':'Ir a HOY'}</div>
      <button id="next">›</button>
    </div>
    <div class="fam-settings-row"><button id="settings">⚙︎ Ajustes</button></div>
  `;
  header.querySelector('#prev').onclick=()=>{currentDate=addDays(currentDate,-1);render();};
  header.querySelector('#next').onclick=()=>{currentDate=addDays(currentDate,1);render();};
  header.querySelector('#goToday').onclick=()=>{currentDate=todayISO();render();};
  header.querySelector('#settings').onclick=openSettings;
}

/* ---------- Render trabajo ---------- */
function renderDay(main){
  const list=notesForDate(currentDate);
  if(!list.length){
    main.innerHTML=`<div class="empty"><b>Nada por aquí</b>Pulsa <b style="display:inline">+</b> para escribir algo.</div>`;
    return;
  }
  const pend=list.filter(n=>!n.done);
  const done=list.filter(n=>n.done);
  const imp=pend.filter(n=>n.important);
  const normal=pend.filter(n=>!n.important);
  let html='';
  if(imp.length){html+=`<div class="section-label">⭐ Importante</div>`+imp.map(n=>cardHTML(n)).join('');}
  if(normal.length){html+=`<div class="section-label">☐ Anotaciones</div>`+normal.map(n=>cardHTML(n)).join('');}
  if(done.length){html+=`<div class="section-label">✓ Completado</div>`+done.map(n=>cardHTML(n)).join('');}
  main.innerHTML=html;
  wireCards(main);
}

function cardHTML(n){
  const prioTag=n.priority?`<span class="tag prio-${n.priority}">${n.priority==='high'?'Alta':n.priority==='med'?'Media':'Baja'}</span>`:'';
  const timeTag=n.time?`<span class="tag">🕒 ${n.time}</span>`:'';
  const catTag=n.category?`<span class="tag">${escapeHTML(n.category)}</span>`:'';
  const dateTag=(n.date!==currentDate&&currentTab!=='hoy')?`<span class="tag">${fmtShort(n.date)}</span>`:'';
  const repeatTag=n.repeat?`<span class="tag">🔁 ${n.repeat==='daily'?'diaria':n.repeat==='weekly'?'semanal':'mensual'}</span>`:'';
  return `
    <div class="card ${n.done?'done':''} ${n.important?'important':''}" data-id="${n.id}" draggable="true">
      <button class="check ${n.done?'on':''}" data-act="check" aria-label="completar"></button>
      <div class="cbody">
        <div class="ctitle">${escapeHTML(n.title||'(sin título)')}</div>
        ${n.text?`<div class="ctext">${escapeHTML(n.text)}</div>`:''}
        <div class="cmeta">${timeTag}${prioTag}${catTag}${dateTag}${repeatTag}</div>
      </div>
      <button class="star ${n.important?'on':''}" data-act="star" aria-label="importante">${n.important?'★':'☆'}</button>
      <button class="more" data-act="more" aria-label="más">⋯</button>
    </div>`;
}

/* ---------- Render familiar (tarjetas grandes) ---------- */
function renderFamDay(main){
  const t=todayISO();
  const all=notes();
  const dayList=notesForDate(currentDate);
  const lateAll=all.filter(n=>!n.done&&n.date<t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

  const dayPend=dayList.filter(n=>!n.done);
  const dayDone=dayList.filter(n=>n.done);
  const dayConHora=dayPend.filter(n=>n.time).sort((a,b)=>a.time.localeCompare(b.time));
  const daySinHora=dayPend.filter(n=>!n.time);

  const resumen = `
    <div class="fam-summary">
      <div class="box"><div class="num">${dayPend.length}</div><div class="lbl">Pendientes hoy</div></div>
      <div class="box"><div class="num">${dayDone.length}</div><div class="lbl">Hechas</div></div>
      <div class="box"><div class="num">${lateAll.length}</div><div class="lbl">Atrasadas</div></div>
    </div>`;

  if(!dayList.length && !lateAll.length){
    main.innerHTML = resumen + `<div class="empty"><b>Sin nada para hoy</b>Toca el botón <b style="display:inline">+</b> para añadir un recordatorio.</div>`;
    return;
  }

  let html = resumen;

  // Atrasadas (colapsadas por defecto)
  if(lateAll.length){
    html+=`
      <details class="fam-fold" ${lateAll.length<=3?'open':''}>
        <summary><span>⚠️</span> Atrasado <span class="badge warn">${lateAll.length}</span><span class="arrow">›</span></summary>
        <div class="fam-fold-body">${lateAll.map(n=>famCardHTML(n)).join('')}</div>
      </details>`;
  }

  // Hoy con hora
  if(dayConHora.length){
    html += `<div class="section-label">🕒 Con hora</div>` + dayConHora.map(n=>famCardHTML(n)).join('');
  }

  // Hoy sin hora
  if(daySinHora.length){
    html += `<div class="section-label">📌 Sin hora</div>` + daySinHora.map(n=>famCardHTML(n)).join('');
  }

  // Hechas (colapsadas si hay más de 2)
  if(dayDone.length){
    html+=`
      <details class="fam-fold" ${dayDone.length<=2?'open':''}>
        <summary><span>✅</span> Hecho hoy <span class="badge ok">${dayDone.length}</span><span class="arrow">›</span></summary>
        <div class="fam-fold-body">${dayDone.map(n=>famCardHTML(n)).join('')}</div>
      </details>`;
  }

  main.innerHTML = html;
  wireFamCards(main);
}

function famCardHTML(n){
  const cat=catInfo(n.category);
  const isLate = !n.done && n.date < todayISO();
  const lines=[];
  if(n.dose) lines.push(`<div class="fam-line"><span class="em">💊</span> Dosis: <strong>${escapeHTML(n.dose)}</strong></div>`);
  if(n.place) lines.push(`<div class="fam-line"><span class="em">📍</span> ${escapeHTML(n.place)}</div>`);
  const alertHTML = n.alert ? `<div class="fam-alert">⏰ Aviso: ${escapeHTML(n.alert)}</div>` : '';
  const lateHTML = isLate ? `<div class="fam-alert" style="background:#fde2d4;border-color:#e8b48a;color:#8a2d10">⚠️ Pendiente de ${fmtShort(n.date)}</div>` : '';

  return `
    <div class="fam-card cat-${cat.id} ${n.done?'done':''}" data-id="${n.id}">
      <button class="fam-check ${n.done?'on':''}" data-act="check" aria-label="completar"></button>
      <div class="fam-body">
        <div class="fam-head">
          <span class="fam-emoji">${cat.emoji}</span>
          <div class="fam-cat-label">${cat.tipo}</div>
          <div class="fam-hour">${n.time?n.time:(n.done?'✓':'—')}</div>
        </div>
        <div class="fam-title">${escapeHTML(n.title||'(sin título)')}</div>
        ${n.text?`<div class="fam-text">${escapeHTML(n.text)}</div>`:''}
        ${lines.join('')}
        ${lateHTML}
        ${alertHTML}
        <div class="fam-actions">
          <button data-act="move">📅 Cambiar día</button>
          <button data-act="edit">✎ Editar</button>
          <button data-act="more">⋯ Más</button>
        </div>
      </div>
    </div>`;
}

function wireFamCards(container){
  container.querySelectorAll('.fam-card').forEach(card=>{
    const id=card.dataset.id;
    card.querySelectorAll('[data-act]').forEach(btn=>{
      btn.onclick=(e)=>{
        e.stopPropagation();
        const act=btn.dataset.act;
        if(act==='check') toggleDone(id);
        else if(act==='move') openMoveMenu(id);
        else if(act==='edit') openEditor(id);
        else if(act==='more') openNoteMenu(id);
      };
    });
    let pressT;
    card.addEventListener('touchstart',()=>{
      pressT=setTimeout(()=>{navigator.vibrate&&navigator.vibrate(15);openMoveMenu(id);},600);
    },{passive:true});
    card.addEventListener('touchend',()=>clearTimeout(pressT));
    card.addEventListener('touchmove',()=>clearTimeout(pressT));
  });
}

/* ---------- Wire tarjetas trabajo ---------- */
function wireCards(container){
  container.querySelectorAll('.card').forEach(card=>{
    const id=card.dataset.id;
    card.querySelectorAll('[data-act]').forEach(btn=>{
      btn.onclick=(e)=>{
        e.stopPropagation();
        const act=btn.dataset.act;
        if(act==='check') toggleDone(id);
        else if(act==='star') toggleImportant(id);
        else if(act==='more') openNoteMenu(id);
      };
    });
    card.addEventListener('click',(e)=>{
      if(e.target.closest('[data-act]'))return;
      openEditor(id);
    });
    card.addEventListener('dragstart',(e)=>{
      card.classList.add('dragging');
      try{e.dataTransfer.setData('text/plain',id);}catch(_){}
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    let pressT;
    card.addEventListener('touchstart',()=>{
      pressT=setTimeout(()=>{navigator.vibrate&&navigator.vibrate(15);openMoveMenu(id);},550);
    },{passive:true});
    card.addEventListener('touchend',()=>clearTimeout(pressT));
    card.addEventListener('touchmove',()=>clearTimeout(pressT));
  });
}

/* ---------- Listas auxiliares ---------- */
function renderAllNotes(main){
  const list=[...notes()].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  if(!list.length){main.innerHTML=`<div class="empty"><b>Sin notas</b>Empieza con el botón +</div>`;return;}
  const esFam=state.currentNotebook==='familiar';
  let last='',html='';
  list.forEach(n=>{
    if(n.date!==last){last=n.date;html+=`<div class="section-label">${fmtLong(n.date)} · ${fmtShort(n.date)}</div>`;}
    html+= esFam?famCardHTML(n):cardHTML(n);
  });
  main.innerHTML=html;
  esFam?wireFamCards(main):wireCards(main);
}
function renderImportantes(main){
  const list=notes().filter(n=>n.important).sort((a,b)=>a.date.localeCompare(b.date));
  const esFam=state.currentNotebook==='familiar';
  if(!list.length){main.innerHTML=`<div class="empty"><b>Sin importantes</b>Marca con ⭐ lo que no quieras perder.</div>`;return;}
  main.innerHTML=list.map(n=>esFam?famCardHTML(n):cardHTML(n)).join('');
  esFam?wireFamCards(main):wireCards(main);
}
function renderPendientes(main){
  const t=todayISO();
  const esFam=state.currentNotebook==='familiar';
  const pend=notes().filter(n=>!n.done);
  const late=pend.filter(n=>n.date<t).sort((a,b)=>a.date.localeCompare(b.date));
  const today=pend.filter(n=>n.date===t);
  const future=pend.filter(n=>n.date>t).sort((a,b)=>a.date.localeCompare(b.date));
  const render=(arr)=>arr.map(n=>esFam?famCardHTML(n):cardHTML(n)).join('');
  let html='';
  if(late.length)html+=`<div class="section-label">⚠︎ Atrasadas</div>`+render(late);
  if(today.length)html+=`<div class="section-label">📌 Hoy</div>`+render(today);
  if(future.length)html+=`<div class="section-label">Próximas</div>`+render(future);
  if(!html)html=`<div class="empty"><b>Todo hecho</b>No tienes pendientes.</div>`;
  main.innerHTML=html;
  esFam?wireFamCards(main):wireCards(main);
}
function renderBuscar(main){
  const esFam=state.currentNotebook==='familiar';
  main.innerHTML=`
    <div class="searchbox"><input id="q" type="text" placeholder="Buscar…" value="${escapeAttr(searchQuery)}" autocomplete="off"></div>
    <div id="results" style="padding:0 14px"></div>`;
  const q=main.querySelector('#q');
  const results=main.querySelector('#results');
  const run=()=>{
    searchQuery=q.value.trim().toLowerCase();
    if(!searchQuery){results.innerHTML=`<div class="empty">Escribe algo para buscar.</div>`;return;}
    const found=notes().filter(n=>
      (n.title||'').toLowerCase().includes(searchQuery)||
      (n.text||'').toLowerCase().includes(searchQuery)||
      (n.category||'').toLowerCase().includes(searchQuery)||
      (n.place||'').toLowerCase().includes(searchQuery)||
      (n.dose||'').toLowerCase().includes(searchQuery)
    ).sort((a,b)=>b.date.localeCompare(a.date));
    if(!found.length){results.innerHTML=`<div class="empty">Sin resultados.</div>`;return;}
    results.innerHTML=found.map(n=>esFam?famCardHTML(n):cardHTML(n)).join('');
    esFam?wireFamCards(results):wireCards(results);
  };
  q.addEventListener('input',run);
  run();
  if(!searchQuery) setTimeout(()=>q.focus(),100);
}

/* ---------- Calendario ---------- */
function renderCalendar(main){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1);
  const startWd=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const mn=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  let html=`<div class="cal">
    <div class="cal-head">
      <button id="calPrev">‹</button>
      <div class="mtitle">${mn[m]} ${y}</div>
      <button id="calNext">›</button>
    </div>
    <div class="cal-grid">
      ${['L','M','X','J','V','S','D'].map(d=>`<div class="wd">${d}</div>`).join('')}`;
  const prevDays=new Date(y,m,0).getDate();
  for(let i=startWd;i>0;i--){html+=`<div class="cal-cell muted">${prevDays-i+1}</div>`;}
  const t=todayISO();
  for(let day=1;day<=daysInMonth;day++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const list=notes().filter(n=>n.date===iso);
    const hasImp=list.some(n=>n.important&&!n.done);
    const hasPend=list.some(n=>!n.done);
    const allDone=list.length>0&&list.every(n=>n.done);
    let dots='';
    if(list.length){
      dots=`<div class="dots">
        ${hasImp?'<div class="dot imp"></div>':''}
        ${hasPend&&!hasImp?'<div class="dot"></div>':''}
        ${allDone?'<div class="dot done"></div>':''}
      </div>`;
    }
    const cls=['cal-cell'];
    if(iso===t)cls.push('today');
    if(iso===currentDate)cls.push('selected');
    html+=`<div class="${cls.join(' ')}" data-date="${iso}">${day}${dots}</div>`;
  }
  const total=startWd+daysInMonth;
  const rest=(7-total%7)%7;
  for(let i=1;i<=rest;i++){html+=`<div class="cal-cell muted">${i}</div>`;}
  html+=`</div></div>`;
  main.innerHTML=html;
  main.querySelector('#calPrev').onclick=()=>{calMonth=new Date(y,m-1,1);render();};
  main.querySelector('#calNext').onclick=()=>{calMonth=new Date(y,m+1,1);render();};
  main.querySelectorAll('.cal-cell[data-date]').forEach(c=>{
    c.onclick=()=>{currentDate=c.dataset.date;currentTab='hoy';render();};
  });
}

/* ---------- Menú tarjeta ---------- */
function openNoteMenu(id){
  const n=notes().find(x=>x.id===id);if(!n)return;
  openSheet(`
    <h3>${escapeHTML(n.title||'Anotación')}</h3>
    <button class="moveopt" data-a="edit">✎ Editar</button>
    <button class="moveopt" data-a="move">📅 Mover a otra fecha…</button>
    <button class="moveopt" data-a="check">${n.done?'☐ Marcar como pendiente':'✓ Marcar como completada'}</button>
    <button class="moveopt" data-a="star">${n.important?'☆ Quitar de importantes':'⭐ Marcar como importante'}</button>
    <button class="moveopt" data-a="dup">⧉ Duplicar</button>
    <button class="moveopt" data-a="del" style="color:#c0392b">🗑 Eliminar</button>
    <div class="actions"><button class="btn-ghost" id="bClose">Cerrar</button></div>
  `);
  const sheet=document.getElementById('sheet');
  sheet.querySelector('#bClose').onclick=closeSheet;
  sheet.querySelectorAll('.moveopt').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='edit'){closeSheet();setTimeout(()=>openEditor(id),50);}
    else if(a==='move'){openMoveMenu(id);}
    else if(a==='check'){toggleDone(id);closeSheet();}
    else if(a==='star'){toggleImportant(id);closeSheet();}
    else if(a==='dup'){duplicateNote(id);closeSheet();}
    else if(a==='del'){if(confirm('¿Eliminar esta anotación?')){deleteNote(id);closeSheet();toast('Eliminada');}}
  });
}

function exportBackup(){
  const data={
    app:'cuaderno',
    version:3,
    exportedAt:new Date().toISOString(),
    notebooks:state.notebooks,
    famName:state.famName
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const ts=new Date().toISOString().slice(0,10);
  a.href=url;a.download=`cuaderno-backup-${ts}.json`;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
  toast('Copia exportada');
}

function importBackup(){
  const input=document.createElement('input');
  input.type='file';input.accept='application/json,.json';
  input.onchange=()=>{
    const f=input.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const parsed=JSON.parse(reader.result);
        let trabajo=[],familiar=[];
        if(parsed.notebooks){
          trabajo=Array.isArray(parsed.notebooks.trabajo?.notes)?parsed.notebooks.trabajo.notes:[];
          familiar=Array.isArray(parsed.notebooks.familiar?.notes)?parsed.notebooks.familiar.notes:[];
        } else if(Array.isArray(parsed.notes)){trabajo=parsed.notes;}
        else if(Array.isArray(parsed)){trabajo=parsed;}
        const clean=(arr)=>arr.filter(n=>n&&typeof n==='object'&&typeof n.date==='string')
          .map(n=>({
            id:n.id||uid(),
            title:n.title||'',
            text:n.text||'',
            date:n.date,time:n.time||'',
            priority:n.priority||'',category:n.category||'',
            place:n.place||'',alert:n.alert||'',dose:n.dose||'',
            important:!!n.important,done:!!n.done,
            repeat:n.repeat||'',createdAt:n.createdAt||Date.now()
          }));
        const t=clean(trabajo),fam=clean(familiar);
        if(!confirm(`Se importarán ${t.length+fam.length} anotaciones (${t.length} trabajo, ${fam.length} familia) y se reemplazarán las actuales. ¿Continuar?`))return;
        state.notebooks.trabajo.notes=t;
        state.notebooks.familiar.notes=fam;
        if(parsed.famName){state.famName=String(parsed.famName);localStorage.setItem(NAME_KEY,state.famName);}
        save();closeSheet();render();toast('Importado');
      }catch(err){alert('No se pudo leer el archivo: '+err.message);}
    };
    reader.readAsText(f);
  };
  input.click();
}

/* ---------- Escape ---------- */
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return escapeHTML(s);}

/* ---------- Teclado ---------- */
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape') closeSheet();
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='ArrowLeft'&&currentTab==='hoy'){currentDate=addDays(currentDate,-1);render();}
  if(e.key==='ArrowRight'&&currentTab==='hoy'){currentDate=addDays(currentDate,1);render();}
  if(e.key==='n'||e.key==='N'){openEditor(null,currentTab==='hoy'?currentDate:todayISO());}
});

/* ---------- Arranque ---------- */
applyTheme();
load();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
</body>
</html>
