<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cuaderno" />
<meta name="theme-color" content="#f5efe1" />
<title>Mi Cuaderno</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf6ea;
    --paper-2:#f4ecdc;
    --paper-line:#e7dcc2;
    --paper-line-soft:#efe6d0;
    --ink:#2b2620;
    --ink-soft:#6f6559;
    --ink-faint:#b3a99a;
    --important:#c9762a;
    --done:#a4a79a;
    --shadow:0 1px 3px rgba(60,40,20,.06), 0 8px 24px rgba(60,40,20,.04);
    --radius:16px;
    --bg:#e9dfc8;
    --serif:'Fraunces', Georgia, 'Iowan Old Style', serif;
    --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --hand:'Caveat', cursive;
    --nb-accent:#3b5a80;
    --nb-accent-soft:#dbe4ef;
  }
  body[data-notebook="trabajo"]{
    --nb-accent:#3b5a80;
    --nb-accent-soft:#dbe4ef;
  }
  body[data-notebook="familiar"]{
    --nb-accent:#a85b3a;
    --nb-accent-soft:#f0d9c8;
  }
  [data-theme="dark"]{
    --paper:#1e1c19;
    --paper-2:#252220;
    --paper-line:#332f2a;
    --paper-line-soft:#2a2723;
    --ink:#ece4d3;
    --ink-soft:#b0a594;
    --ink-faint:#6a6155;
    --important:#e0a25b;
    --done:#5c615a;
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    --bg:#141311;
  }
  [data-theme="dark"] body[data-notebook="trabajo"]{
    --nb-accent:#7ea8d4; --nb-accent-soft:#1f2b38;
  }
  [data-theme="dark"] body[data-notebook="familiar"]{
    --nb-accent:#e0a878; --nb-accent-soft:#3a2a1f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
    padding-top:env(safe-area-inset-top);
  }
  #app{
    max-width:640px;margin:0 auto;min-height:100vh;
    background:var(--paper);position:relative;
    display:flex;flex-direction:column;
    box-shadow:0 0 60px rgba(60,40,20,.06);
  }
  .notebooks{
    display:flex;gap:6px;padding:10px 14px 8px;
    background:var(--paper);border-bottom:1px solid var(--paper-line);
    position:sticky;top:0;z-index:30;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  .nb-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 8px;border-radius:12px;border:1.5px solid var(--paper-line);
    background:transparent;color:var(--ink-soft);font-size:13.5px;font-weight:600;
    cursor:pointer;transition:.15s;
  }
  .nb-btn.active{
    background:var(--nb-accent);color:#fff;border-color:var(--nb-accent);
  }
  .nb-btn .em{font-size:16px;line-height:1}
  header{
    background:var(--paper);border-bottom:1px solid var(--paper-line);
    padding:14px 18px 12px;position:sticky;top:0;z-index:20;
  }
  .cuad-header{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  }
  .cuad-day-label{
    font-family:var(--serif);
    font-size:11px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;margin-bottom:2px;
  }
  .cuad-date-main{
    font-family:var(--serif);
    font-size:28px;font-weight:700;letter-spacing:-.4px;line-height:1.05;
    color:var(--ink);
  }
  .cuad-date-sub{
    font-family:var(--sans);font-size:12px;color:var(--ink-soft);
    margin-top:4px;letter-spacing:.3px;
  }
  .cuad-actions{
    display:flex;gap:6px;align-items:center;flex-shrink:0;
  }
  .cuad-actions button{
    background:transparent;border:1px solid var(--paper-line);
    color:var(--ink-soft);
    font-size:20px;padding:8px 12px;border-radius:12px;cursor:pointer;
    min-width:44px;min-height:44px;
    display:flex;align-items:center;justify-content:center;
  }
  .cuad-actions button:active{background:var(--nb-accent-soft);color:var(--nb-accent);border-color:var(--nb-accent)}
  .cuad-actions .btn-cal{
    background:var(--nb-accent-soft);color:var(--nb-accent);border-color:var(--nb-accent);
    font-size:22px;
  }
  .cuad-nav{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:12px;gap:8px;
  }
  .cuad-nav button{
    background:transparent;border:none;color:var(--ink-soft);
    font-family:var(--serif);font-size:13px;padding:6px 4px;cursor:pointer;
    letter-spacing:.3px;
  }
  .cuad-nav button:active{color:var(--ink)}
  .cuad-nav .home{
    background:var(--nb-accent);color:#fff;border-radius:20px;
    padding:6px 14px;font-size:11px;font-weight:600;letter-spacing:1px;
    text-transform:uppercase;
  }
  .cuad-nav .home:active{opacity:.85}
  .fam-header{padding:18px 18px 14px;background:var(--paper);
    border-bottom:1px solid var(--paper-line);position:sticky;top:0;z-index:20}
  .fam-hello{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:4px}
  .fam-date{font-size:17px;color:var(--ink-soft);text-transform:capitalize;margin-bottom:10px}
  .fam-daynav{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .fam-daynav button{
    background:var(--paper-2);border:1.5px solid var(--paper-line);border-radius:14px;
    padding:12px 20px;font-size:22px;color:var(--ink);cursor:pointer;font-weight:700;
    min-width:64px;
  }
  .fam-daynav .fam-day-label{
    flex:1;text-align:center;font-size:19px;font-weight:700;
    background:var(--nb-accent-soft);padding:12px 8px;border-radius:14px;
  }
  .fam-daynav .fam-day-label.home{background:var(--nb-accent);color:#fff}
  .fam-settings-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
  .fam-settings-row button{
    background:transparent;border:none;color:var(--ink-soft);font-size:14px;
    padding:6px 10px;border-radius:10px;cursor:pointer;
  }
  .fam-settings-row .btn-cal{
    background:var(--nb-accent-soft);color:var(--nb-accent);
    border:1px solid var(--nb-accent);font-weight:600;
    font-size:15px;padding:9px 14px;border-radius:12px;
  }
  .med-banner{
    background:linear-gradient(135deg,#e6f0fb,#d6e6f8);
    border:1px solid #b8d4ee;border-radius:14px;
    padding:12px 14px;margin:10px 0 0;
    display:flex;flex-direction:column;gap:8px;
  }
  [data-theme="dark"] .med-banner{background:linear-gradient(135deg,#1e2a38,#243448);border-color:#3a5470}
  .med-banner .line{display:flex;align-items:center;gap:10px;
    font-size:17px;font-weight:600;color:#1e4a75;}
  [data-theme="dark"] .med-banner .line{color:#b8d4ee}
  .med-banner .line .em{font-size:22px}
  .med-banner .line .time{margin-left:auto;font-weight:800;font-size:19px;letter-spacing:-.3px}
  .med-banner .headline{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;
    color:#1e4a75;font-weight:800;margin-bottom:2px;opacity:.75}
  [data-theme="dark"] .med-banner .headline{color:#b8d4ee}
  main{flex:1;padding:8px 18px 190px;overflow:hidden}
  main.fam{padding:14px 14px 200px}
  .section-label{
    font-family:var(--serif);
    font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;
    margin:24px 4px 12px;display:flex;align-items:center;gap:8px;
  }
  .section-label::after{
    content:"";flex:1;height:1px;background:var(--paper-line-soft);
  }
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:50px 20px;line-height:1.6}
  .empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px;font-family:var(--serif)}
  .empty .quill{font-size:48px;opacity:.35;display:block;margin-bottom:14px}
  main.fam .empty{font-size:17px;padding:60px 24px}
  .notebook-page{
    background:var(--paper);position:relative;
    padding:0 0 40px;
  }
  .notebook-page::before{
    content:"";
    position:absolute;left:26px;top:0;bottom:0;width:1px;
    background:linear-gradient(to bottom, transparent, var(--paper-line-soft) 12%, var(--paper-line-soft) 88%, transparent);
    pointer-events:none;
  }
  @media(max-width:520px){
    .notebook-page::before{left:20px}
  }
  .note{
    position:relative;
    padding:14px 0 14px 44px;
    border-bottom:1px solid var(--paper-line-soft);
    transition:opacity .15s;
  }
  @media(max-width:520px){.note{padding-left:36px}}
  .note:last-child{border-bottom:none}
  .note.done{opacity:.55}
  .note.done .note-text{text-decoration:line-through;text-decoration-color:var(--ink-faint)}
  .note-check{
    position:absolute;left:0;top:16px;
    width:26px;height:26px;
    border:2px solid var(--ink-soft);border-radius:7px;
    background:transparent;cursor:pointer;padding:0;
    transition:.15s;
  }
  .note-check:hover{border-color:var(--ink)}
  .note-check.on{background:var(--done);border-color:var(--done)}
  .note-check.on::after{
    content:"✓";color:#fff;font-size:15px;font-weight:700;
    position:absolute;left:5px;top:-1px;
  }
  .note-time{
    font-family:var(--serif);
    font-size:11px;letter-spacing:1.5px;color:var(--ink-faint);
    text-transform:uppercase;font-weight:600;margin-bottom:4px;
  }
  .note-text{
    font-size:15.5px;line-height:1.5;
    color:var(--ink);white-space:pre-wrap;word-wrap:break-word;
  }
  .note-text.hand{
    font-family:var(--hand);
    font-size:20px;line-height:1.35;
  }
  .note-tags{
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    margin-top:6px;font-size:11px;color:var(--ink-faint);
  }
  .note-tag{
    display:inline-flex;align-items:center;gap:4px;
    padding:2px 8px;border-radius:10px;font-weight:600;
    letter-spacing:.4px;
  }
  .note-tag.work{background:var(--nb-accent-soft);color:var(--nb-accent)}
  .note-tag.personal{background:#dcecd9;color:#3d6b4a}
  [data-theme="dark"] .note-tag.personal{background:#1e2c22;color:#8ec09a}
  .note-tag.important{background:#fbe6cf;color:var(--important)}
  [data-theme="dark"] .note-tag.important{background:#3a2e18;color:#e0a25b}
  .note-more{
    background:var(--paper-2);
    border:1px solid var(--paper-line);
    color:var(--ink-soft);
    font-size:20px;
    width:38px;height:38px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
    position:absolute;right:-4px;top:12px;
    line-height:1;
    transition:.15s;
  }
  .note-more:active{background:var(--paper-line-soft)}
  @media(max-width:520px){.note-more{right:-8px}}
  .note-checklist{margin:6px 0 0 0;padding:0;list-style:none}
  .note-checklist li{
    display:flex;align-items:flex-start;gap:8px;
    padding:4px 0;font-size:14.5px;line-height:1.4;
  }
  .note-checklist li .cbox{
    flex:0 0 20px;width:20px;height:20px;
    border:2px solid var(--ink-soft);border-radius:5px;
    margin-top:2px;cursor:pointer;background:transparent;padding:0;
    position:relative;
  }
  .note-checklist li .cbox.on{background:var(--done);border-color:var(--done)}
  .note-checklist li .cbox.on::after{
    content:"✓";color:#fff;font-size:12px;font-weight:700;
    position:absolute;left:3px;top:-2px;
  }
  .note-checklist li.on span{text-decoration:line-through;color:var(--ink-faint)}
  .fab{
    position:fixed;right:calc(50% - 320px + 20px);
    bottom:calc(96px + env(safe-area-inset-bottom));
    background:var(--nb-accent);color:#fff;
    border:none;border-radius:28px;padding:14px 22px 14px 18px;
    font-family:var(--serif);font-size:15px;font-weight:600;
    letter-spacing:.3px;
    box-shadow:0 8px 24px rgba(60,40,20,.28);
    cursor:pointer;z-index:30;
    display:flex;align-items:center;gap:8px;
  }
  .fab:active{transform:scale(.96)}
  .fab .plus{font-size:20px;line-height:1}
  @media(max-width:680px){.fab{right:20px}}
  body[data-notebook="familiar"] .fab{
    background:var(--nb-accent);color:#fff;
    width:62px;height:62px;border-radius:50%;padding:0;justify-content:center;
    font-size:32px;font-family:inherit;
    bottom:calc(96px + env(safe-area-inset-bottom));
  }
  body[data-notebook="familiar"] .fab .label-txt{display:none}
  body[data-notebook="familiar"] .fab .plus{font-size:32px}
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;background:var(--paper);
    border-top:1px solid var(--paper-line);
    display:flex;justify-content:space-around;align-items:center;
    padding:8px 4px calc(10px + env(safe-area-inset-bottom));
    z-index:25;max-width:640px;margin:0 auto;
  }
  nav.tabs button{
    background:transparent;border:none;color:var(--ink-faint);
    font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:4px 4px;cursor:pointer;font-weight:500;letter-spacing:.3px;
    flex:1;min-width:0;
  }
  nav.tabs button .ico{font-size:19px;line-height:1}
  nav.tabs button.active{color:var(--nb-accent);font-weight:700}
  body[data-notebook="familiar"] nav.tabs button{font-size:11px}
  body[data-notebook="familiar"] nav.tabs button .ico{font-size:22px}
  .sheet-bg{position:fixed;inset:0;background:rgba(30,20,10,.35);z-index:40;
    display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex}
  .sheet{background:var(--paper);width:100%;max-width:640px;
    border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:92vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.25);
    animation:slideup .24s ease-out}
  @keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet h3{
    margin:0 0 16px;font-family:var(--serif);
    font-size:20px;font-weight:700;letter-spacing:-.3px;
  }
  body[data-notebook="familiar"] .sheet h3{font-size:19px;font-family:inherit;font-weight:600}
  .sheet input[type=text],
  .sheet textarea,
  .sheet input[type=date],
  .sheet input[type=time],
  .sheet select{
    width:100%;padding:12px 14px;border:1px solid var(--paper-line);border-radius:12px;
    font-size:15px;font-family:var(--sans);background:var(--paper-2);color:var(--ink);
    margin-bottom:10px;-webkit-appearance:none;appearance:none;
  }
  .sheet textarea{
    min-height:100px;resize:vertical;line-height:1.5;font-size:16px;
  }
  .sheet textarea.hand{font-family:var(--hand);font-size:22px;line-height:1.35}
  body[data-notebook="familiar"] .sheet input,
  body[data-notebook="familiar"] .sheet textarea,
  body[data-notebook="familiar"] .sheet select{
    font-size:17px;padding:14px 12px;
  }
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{
    padding:7px 12px;border-radius:16px;border:1px solid var(--paper-line);
    background:transparent;font-size:13px;cursor:pointer;color:var(--ink);
    font-family:var(--sans);transition:.15s;
  }
  .chip.on{background:var(--nb-accent);color:#fff;border-color:var(--nb-accent)}
  .chip.work.on{background:var(--nb-accent);border-color:var(--nb-accent);color:#fff}
  .chip.personal.on{background:#4a8a5b;border-color:#4a8a5b;color:#fff}
  .chip.important.on{background:var(--important);border-color:var(--important);color:#fff}
  body[data-notebook="familiar"] .chip{font-size:15px;padding:12px 16px;border-radius:14px}
  .sheet .actions{display:flex;gap:8px;margin-top:12px}
  .sheet .actions button{
    flex:1;padding:14px;border-radius:14px;border:none;
    font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans);
  }
  body[data-notebook="familiar"] .sheet .actions button{font-size:17px;padding:16px}
  .btn-primary{background:var(--nb-accent);color:#fff}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--paper-line)!important}
  .label{
    font-family:var(--serif);font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--ink-faint);font-weight:600;
    margin:6px 2px 8px;
  }
  body[data-notebook="familiar"] .label{font-family:inherit;font-size:13px;color:var(--ink-soft)}
  .moveopt{
    display:block;width:100%;text-align:left;
    padding:14px 16px;background:transparent;
    border:1px solid var(--paper-line);border-radius:12px;
    margin-bottom:8px;font-size:15px;color:var(--ink);
    cursor:pointer;font-family:var(--sans);
  }
  .moveopt:active{background:var(--paper-line-soft)}
  body[data-notebook="familiar"] .moveopt{font-size:17px;padding:18px 14px}
  .quick-sheet textarea{
    min-height:180px;font-size:17px;line-height:1.55;
    background:transparent;border:none;border-bottom:1px solid var(--paper-line-soft);
    border-radius:0;padding:4px 2px;
  }
  .quick-sheet textarea:focus{outline:none;border-bottom-color:var(--ink-soft)}
  .quick-meta{
    display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center;
  }
  .quick-meta button{
    background:transparent;border:1px solid var(--paper-line);
    border-radius:20px;padding:7px 14px;font-size:13px;
    color:var(--ink-soft);cursor:pointer;font-family:var(--sans);
  }
  .quick-meta button.on{background:var(--nb-accent);color:#fff;border-color:var(--nb-accent)}
  .cal{padding:8px 6px 130px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 12px}
  .cal-head button{background:transparent;border:1px solid var(--paper-line);
    border-radius:12px;font-size:22px;padding:8px 16px;cursor:pointer;color:var(--ink);
    min-width:52px;min-height:48px;
    display:flex;align-items:center;justify-content:center;
  }
  .cal-head button:active{background:var(--nb-accent-soft)}
  .cal-head .mtitle{font-family:var(--serif);font-size:22px;font-weight:700;text-transform:capitalize}
  .cal-med-info{
    background:#e6f0fb;border:1px solid #b8d4ee;border-radius:12px;
    padding:10px 14px;margin:0 6px 14px;
    font-size:14px;font-weight:700;color:#1e4a75;
    display:flex;align-items:center;gap:8px;cursor:pointer;
  }
  [data-theme="dark"] .cal-med-info{background:#1e2a38;border-color:#3a5470;color:#b8d4ee}
  .cal-med-info .em{font-size:18px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-grid .wd{font-size:12px;text-align:center;color:var(--ink-soft);padding:6px 0;font-weight:700}
  .cal-cell{
    aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:12px;cursor:pointer;position:relative;font-size:16px;
    border:1px solid transparent;color:var(--ink);background:transparent;
    min-height:44px;
  }
  .cal-cell.muted{color:var(--ink-faint);opacity:.35}
  .cal-cell.today{background:var(--nb-accent-soft);font-weight:800}
  .cal-cell.selected{border-color:var(--nb-accent);font-weight:800}
  .cal-cell.has-notes{background:rgba(0,0,0,.03);font-weight:700}
  [data-theme="dark"] .cal-cell.has-notes{background:rgba(255,255,255,.04)}
  .cal-cell .dots{display:flex;gap:3px;margin-top:4px;position:absolute;bottom:7px;flex-wrap:wrap;justify-content:center;max-width:85%}
  .cal-cell .dot{width:6px;height:6px;border-radius:50%;background:var(--nb-accent)}
  .cal-cell .dot.imp{background:var(--important)}
  .cal-cell .dot.done{background:var(--done)}

<body data-notebook="trabajo">
<div id="app">
  <div class="notebooks" id="notebooks">
    <button class="nb-btn" data-nb="trabajo"><span class="em">✍️</span> Cuaderno</button>
    <button class="nb-btn" data-nb="familiar"><span class="em">🏠</span> Familia</button>
  </div>
  <header id="header"></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
  <button class="fab" id="fab" aria-label="Escribir">
    <span class="plus">+</span><span class="label-txt">Escribir</span>
  </button>
  <div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const STORE_KEY='cuaderno.v2';
const THEME_KEY='cuaderno.theme';
const NOTEBOOK_KEY='cuaderno.notebook';
const NAME_KEY='cuaderno.famName';
const CATEGORIAS_FAMILIA=[
  {id:'medicacion', emoji:'💊', label:'Medicación', tipo:'PASTILLA'},
  {id:'medico',     emoji:'🩺', label:'Médico',     tipo:'MÉDICO'},
  {id:'compras',    emoji:'🛒', label:'Compras',    tipo:'COMPRAS'},
  {id:'peluqueria', emoji:'💇', label:'Peluquería', tipo:'PELUQUERÍA'},
  {id:'llamadas',   emoji:'📞', label:'Llamadas',   tipo:'LLAMADAS'},
  {id:'tramites',   emoji:'📄', label:'Trámites',   tipo:'TRÁMITES'},
  {id:'casa',       emoji:'🏠', label:'Casa',       tipo:'CASA'},
  {id:'otros',      emoji:'📌', label:'Otros',      tipo:'OTROS'}
];
let state={
  notebooks:{ trabajo:{notes:[]}, familiar:{notes:[]} },
  theme: localStorage.getItem(THEME_KEY)||'light',
  currentNotebook: localStorage.getItem(NOTEBOOK_KEY)||'trabajo',
  famName: localStorage.getItem(NAME_KEY)||''
};
let currentDate=todayISO();
let currentTab='hoy';
let calMonth=new Date();
let searchQuery='';

function todayISO(){return toISO(new Date());}
function toISO(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return toISO(d);}
function fmtLong(iso){
  const d=parseISO(iso);
  const wd=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()];
  const mn=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()];
  return `${wd} ${d.getDate()} de ${mn}`;
}
function fmtShort(iso){const d=parseISO(iso);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;}
function nextWeekday(target){const d=new Date();const cur=d.getDay()===0?7:d.getDay();let diff=(target-cur+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return toISO(d);}
function greeting(){
  const h=new Date().getHours();
  let g;
  if(h<6)g='Buenas noches';
  else if(h<13)g='Buenos días';
  else if(h<20)g='Buenas tardes';
  else g='Buenas noches';
  return state.famName ? `${g}, ${state.famName}` : g;
}
function dayName(iso){const d=parseISO(iso);return ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][d.getDay()];}
function monthNameUpper(iso){const d=parseISO(iso);return ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'][d.getMonth()];}

function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const p=JSON.parse(raw);
      if(p && p.notebooks){
        if(Array.isArray(p.notebooks.trabajo?.notes)) state.notebooks.trabajo.notes=p.notebooks.trabajo.notes.map(normalizeNote);
        if(Array.isArray(p.notebooks.familiar?.notes)) state.notebooks.familiar.notes=p.notebooks.familiar.notes.map(normalizeNote);
      }
    }
  }catch(e){console.warn('load error',e);}
}
function normalizeNote(n){
  return {
    id:n.id||uid(), title:n.title||'', text:n.text||'',
    date:n.date||todayISO(), time:n.time||'',
    priority:n.priority||'', category:n.category||'',
    place:n.place||'', alert:n.alert||'', dose:n.dose||'',
    important:!!n.important, done:!!n.done, repeat:n.repeat||'',
    createdAt:n.createdAt||Date.now(), kind:n.kind||'nota',
    label:n.label||'', hand:!!n.hand,
    checklist:Array.isArray(n.checklist)?n.checklist:[]
  };
}
function save(){try{localStorage.setItem(STORE_KEY, JSON.stringify({notebooks:state.notebooks}));}catch(e){toast('No se pudo guardar');}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function notes(){return state.notebooks[state.currentNotebook].notes;}
function setNotes(arr){state.notebooks[state.currentNotebook].notes=arr;}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  document.body.setAttribute('data-notebook', state.currentNotebook);
  const meta=document.querySelector('meta[name=theme-color]');
  const col = state.currentNotebook==='familiar' ? '#f5e8dd' : '#f5efe1';
  if(meta) meta.setAttribute('content', state.theme==='dark'?'#141311':col);
}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem(THEME_KEY,state.theme);applyTheme();render();}
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);
}
function switchNotebook(nb){
  if(nb!==state.currentNotebook){
    state.currentNotebook=nb;
    localStorage.setItem(NOTEBOOK_KEY,nb);
    currentTab='hoy'; currentDate=todayISO(); searchQuery='';
    applyTheme(); render();
    toast(nb==='trabajo'?'✍️ Mi Cuaderno':'🏠 Familia');
  }
}
function addNote(n){
  const note=normalizeNote({...n,id:uid(),createdAt:Date.now()});
  notes().push(note);save();render();return note;
}
function updateNote(id,patch){const n=notes().find(x=>x.id===id);if(!n)return;Object.assign(n,patch);save();}
function deleteNote(id){setNotes(notes().filter(n=>n.id!==id));save();render();}
function duplicateNote(id){
  const n=notes().find(x=>x.id===id);if(!n)return;
  const copy={...n,id:uid(),done:false,createdAt:Date.now(),checklist:n.checklist.map(c=>({...c,done:false}))};
  notes().push(copy);save();render();toast('Duplicada');
}
function toggleDone(id){
  const n=notes().find(x=>x.id===id);if(!n)return;
  n.done=!n.done;
  if(n.done && n.repeat){
    const next=nextRepeat(n.date,n.repeat);
    if(next){notes().push({...n,id:uid(),done:false,date:next,createdAt:Date.now()});}
  }
  save();render();
}
function nextRepeat(iso,type){
  const d=parseISO(iso);
  if(type==='daily'){d.setDate(d.getDate()+1);return toISO(d);}
  if(type==='weekly'){d.setDate(d.getDate()+7);return toISO(d);}
  if(type==='monthly'){d.setMonth(d.getMonth()+1);return toISO(d);}
  if(type==='yearly'){d.setFullYear(d.getFullYear()+1);return toISO(d);}
  return null;
}
function moveNote(id,newDate){const n=notes().find(x=>x.id===id);if(!n)return;n.date=newDate;save();render();toast('Movida al '+fmtShort(newDate));}
function toggleImportant(id){const n=notes().find(x=>x.id===id);if(!n)return;n.important=!n.important;save();render();}
function toggleCheckItem(noteId,idx){
  const n=notes().find(x=>x.id===noteId);if(!n||!n.checklist[idx])return;
  n.checklist[idx].done=!n.checklist[idx].done;save();render();
}
function notesForDate(iso){
  return notes().filter(n=>n.date===iso).sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    if(a.time&&b.time)return a.time.localeCompare(b.time);
    if(a.time)return -1;if(b.time)return 1;
    return a.createdAt-b.createdAt;
  });
}
function lateNotes(){const t=todayISO();return notes().filter(n=>!n.done&&n.date<t);}
function catInfo(id){return CATEGORIAS_FAMILIA.find(c=>c.id===id)||CATEGORIAS_FAMILIA[CATEGORIAS_FAMILIA.length-1];}
function medicalAlertsFor(iso){
  const list=notesForDate(iso).filter(n=>!n.done && (n.category==='medico'||n.category==='medicacion'));
  const meds=list.filter(n=>n.category==='medico').sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const pills=list.filter(n=>n.category==='medicacion').sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  return {meds,pills};
}
function medicalAlertsHTML(iso){
  const {meds,pills}=medicalAlertsFor(iso);
  if(!meds.length && !pills.length) return '';
  let lines='';
  if(meds.length){
    const times=meds.map(m=>m.time||'—').join(' · ');
    const title=meds.length===1?meds[0].title:`${meds.length} citas médicas`;
    lines+=`<div class="line"><span class="em">🩺</span> <span>${escapeHTML(title)}</span> <span class="time">${times}</span></div>`;
  }
  if(pills.length){
    const times=pills.map(p=>p.time).filter(Boolean).join(' · ');
    const title=pills.length===1?'Medicación':`${pills.length} tomas`;
    lines+=`<div class="line"><span class="em">💊</span> <span>${escapeHTML(title)}</span> <span class="time">${times||'—'}</span></div>`;
  }
  return `<div class="med-banner"><div class="headline">Aviso de hoy</div>${lines}</div>`;
}
function render(){
  applyTheme();
  document.querySelectorAll('.nb-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.nb===state.currentNotebook);
    b.onclick=()=>switchNotebook(b.dataset.nb);
  });
  const header=document.getElementById('header');
  const main=document.getElementById('main');
  const tabs=document.getElementById('tabs');
  const fab=document.getElementById('fab');
  const esFam = state.currentNotebook==='familiar';
  main.classList.toggle('fam', esFam);
  const tabDefs = esFam
    ? [{id:'hoy',ico:'📅',label:'Hoy'},{id:'calendario',ico:'📆',label:'Calendario'},{id:'notas',ico:'📝',label:'Notas'},{id:'importantes',ico:'⭐',label:'Importantes'},{id:'pendientes',ico:'📌',label:'Pendientes'},{id:'buscar',ico:'🔎',label:'Buscar'}]
    : [{id:'hoy',ico:'📅',label:'Hoy'},{id:'indice',ico:'📖',label:'Índice'},{id:'calendario',ico:'🗓',label:'Calendario'},{id:'buscar',ico:'🔍',label:'Buscar'},{id:'importantes',ico:'⭐',label:'Importantes'}];
  tabs.innerHTML=tabDefs.map(t=>
    `<button data-tab="${t.id}" class="${currentTab===t.id?'active':''}"><span class="ico">${t.ico}</span>${t.label}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    currentTab=b.dataset.tab;
    if(currentTab==='calendario'){calMonth=new Date();}
    if(currentTab==='buscar'){searchQuery='';}
    render();
  });
  if(currentTab==='hoy'){
    if(esFam){ renderFamHeader(header); fab.style.display='flex'; renderFamDay(main); }
    else { renderCuadHeader(header); fab.style.display='flex'; renderCuadDay(main); }
  } else if(currentTab==='indice'){
    renderCuadHeader(header, {mini:true, title:'Índice', sub:'Todas tus anotaciones por fecha'});
    fab.style.display='flex'; renderIndex(main);
  } else if(currentTab==='calendario'){
    if(esFam){
      header.innerHTML=`<div class="fam-header"><div class="fam-hello">Calendario</div><div class="fam-date">Toca un día para abrirlo</div><div class="fam-settings-row"><button id="settings">⚙︎ Ajustes</button></div></div>`;
    } else {
      renderCuadHeader(header,{mini:true, title:'Calendario', sub:'Toca un día para abrirlo'});
    }
    header.querySelector('#settings').onclick=openSettings;
    fab.style.display='flex'; renderCalendar(main);
  } else if(currentTab==='notas'){

function noteHTML(n){
  const timeLabel = n.time ? `<div class="note-time">${n.time}</div>` : '';
  const tags=[];
  if(n.label==='trabajo') tags.push(`<span class="note-tag work">TRABAJO</span>`);
  if(n.label==='personal') tags.push(`<span class="note-tag personal">PERSONAL</span>`);
  if(n.important) tags.push(`<span class="note-tag important">⭐ IMPORTANTE</span>`);
  if(n.place) tags.push(`<span class="note-tag">📍 ${escapeHTML(n.place)}</span>`);
  if(n.alert) tags.push(`<span class="note-tag">⏰ ${escapeHTML(n.alert)}</span>`);
  let body='';
  if(n.text) body+=`<div class="note-text ${n.hand?'hand':''}">${escapeHTML(n.text)}</div>`;
  if(n.checklist && n.checklist.length){
    body+=`<ul class="note-checklist">`+n.checklist.map((c,i)=>`
      <li class="${c.done?'on':''}">
        <button class="cbox ${c.done?'on':''}" data-act="toggle-item" data-idx="${i}" aria-label="marcar"></button>
        <span>${escapeHTML(c.text)}</span>
      </li>`).join('')+`</ul>`;
  }
  return `
    <div class="note ${n.done?'done':''}" data-id="${n.id}">
      <button class="note-check ${n.done?'on':''}" data-act="check" aria-label="completar"></button>
      ${timeLabel}
      ${body}
      ${tags.length?`<div class="note-tags">${tags.join('')}</div>`:''}
      <button class="note-more" data-act="more" aria-label="más">⋯</button>
    </div>`;
}
function wireNotes(container){
  container.querySelectorAll('.note').forEach(note=>{
    const id=note.dataset.id;
    note.querySelectorAll('[data-act]').forEach(btn=>{
      btn.onclick=(e)=>{
        e.stopPropagation();
        const act=btn.dataset.act;
        if(act==='check') toggleDone(id);
        else if(act==='toggle-item') toggleCheckItem(id, parseInt(btn.dataset.idx,10));
        else if(act==='more') openNoteMenu(id);
      };
    });
    let pressT;
    note.addEventListener('touchstart',()=>{pressT=setTimeout(()=>{navigator.vibrate&&navigator.vibrate(15);openMoveMenu(id);},600);},{passive:true});
    note.addEventListener('touchend',()=>clearTimeout(pressT));
    note.addEventListener('touchmove',()=>clearTimeout(pressT));
  });
}

function countMedicalInMonth(y,m){
  const prefix=`${y}-${String(m+1).padStart(2,'0')}-`;
  const list=notes().filter(n=>n.date.startsWith(prefix)&&!n.done&&(n.category==='medico'||n.category==='medicacion'));
  const meds=list.filter(n=>n.category==='medico').length;
  const pills=list.filter(n=>n.category==='medicacion').length;
  return {meds,pills,total:list.length};
}
function renderCalendar(main){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1);
  const startWd=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const mn=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const esFam=state.currentNotebook==='familiar';
  const {meds:medCount,pills:pillCount,total:medTotal}=countMedicalInMonth(y,m);
  const medInfo = esFam && medTotal>0 ? `
    <div class="cal-med-info" id="medInfo">
      <span class="em">🩺</span>
      Este mes: ${medCount} cita${medCount!==1?'s':''} médica${medCount!==1?'s':''} · ${pillCount} toma${pillCount!==1?'s':''} de medicación
    </div>` : '';
  let html=`<div class="cal">
    <div class="cal-head">
      <button id="calPrev">‹</button>
      <div class="mtitle">${mn[m]} ${y}</div>
      <button id="calNext">›</button>
    </div>
    ${medInfo}
    <div class="cal-grid">
      ${['L','M','X','J','V','S','D'].map(d=>`<div class="wd">${d}</div>`).join('')}`;
  const prevDays=new Date(y,m,0).getDate();
  for(let i=startWd;i>0;i--){html+=`<div class="cal-cell muted">${prevDays-i+1}</div>`;}
  const t=todayISO();
  for(let day=1;day<=daysInMonth;day++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const list=notes().filter(n=>n.date===iso);
    const hasImp=list.some(n=>n.important&&!n.done);
    const hasPend=list.some(n=>!n.done);
    const allDone=list.length>0&&list.every(n=>n.done);
    const hasMed=list.some(n=>!n.done&&n.category==='medico');
    const hasPill=list.some(n=>!n.done&&n.category==='medicacion');
    const hasAny=list.length>0;
    let dots='';
    if(list.length){
      if(esFam){
        dots=`<div class="dots">
          ${hasMed?'<div class="dot med"></div>':''}
          ${hasPill?'<div class="dot pill"></div>':''}
          ${hasImp?'<div class="dot imp"></div>':''}
          ${hasPend&&!hasImp&&!hasMed&&!hasPill?'<div class="dot"></div>':''}
          ${allDone&&!hasMed&&!hasPill?'<div class="dot done"></div>':''}
        </div>`;
      } else {
        dots=`<div class="dots">
          ${hasImp?'<div class="dot imp"></div>':''}
          ${hasPend&&!hasImp?'<div class="dot"></div>':''}
          ${allDone?'<div class="dot done"></div>':''}
        </div>`;
      }
    }
    const cls=['cal-cell'];
    if(iso===t)cls.push('today');
    if(iso===currentDate)cls.push('selected');
    if(hasAny)cls.push('has-notes');
    html+=`<div class="${cls.join(' ')}" data-date="${iso}">${day}${dots}</div>`;
  }
  const total=startWd+daysInMonth;
  const rest=(7-total%7)%7;
  for(let i=1;i<=rest;i++){html+=`<div class="cal-cell muted">${i}</div>`;}
  html+=`</div></div>`;
  main.innerHTML=html;
  main.querySelector('#calPrev').onclick=()=>{calMonth=new Date(y,m-1,1);render();};
  main.querySelector('#calNext').onclick=()=>{calMonth=new Date(y,m+1,1);render();};
  main.querySelectorAll('.cal-cell[data-date]').forEach(c=>{
    c.onclick=()=>{currentDate=c.dataset.date;currentTab='hoy';render();};
  });
}
function openSheet(html, className){
  const bg=document.getElementById('sheetBg');
  const sheet=document.getElementById('sheet');
  sheet.className='sheet'+(className?' '+className:'');
  sheet.innerHTML=html;bg.classList.add('open');
  bg.onclick=(e)=>{if(e.target===bg) closeSheet();};
}
function closeSheet(){document.getElementById('sheetBg').classList.remove('open');}
function openQuickWrite(){
  if(state.currentNotebook==='familiar'){ openEditorFam(null); return; }
  openSheet(`
    <h3>Escribir</h3>
    <textarea id="q_text" placeholder="Escribe lo que quieras…" autofocus></textarea>
    <div class="quick-meta" id="q_meta">
      <button data-opt="label" data-val="trabajo">📘 Trabajo</button>
      <button data-opt="label" data-val="personal">🟩 Personal</button>
      <button data-opt="important">⭐ Importante</button>
      <button data-opt="hand">✍️ Manuscrita</button>
      <button data-opt="time">🕒 Hora</button>
      <button data-opt="checklist">☑ Lista</button>
    </div>
    <div id="q_extra"></div>
    <div class="actions" style="margin-top:16px">
      <button class="btn-ghost" id="bCancel">Cancelar</button>
      <button class="btn-primary" id="bSave">Guardar</button>
    </div>
  `, 'quick-sheet');
  const sheet=document.getElementById('sheet');
  const ta=sheet.querySelector('#q_text');
  setTimeout(()=>ta.focus(),120);
  const draft={label:'',important:false,hand:false,time:'',checklist:[]};
  sheet.querySelectorAll('#q_meta button').forEach(b=>{
    b.onclick=()=>{
      const opt=b.dataset.opt;
      if(opt==='label'){
        const v=b.dataset.val;
        if(draft.label===v){draft.label='';b.classList.remove('on');}
        else{draft.label=v;sheet.querySelectorAll('#q_meta button[data-opt="label"]').forEach(x=>x.classList.remove('on'));b.classList.add('on');}
      } else if(opt==='important'){draft.important=!draft.important;b.classList.toggle('on',draft.important);}
      else if(opt==='hand'){draft.hand=!draft.hand;b.classList.toggle('on',draft.hand);ta.classList.toggle('hand',draft.hand);}
      else if(opt==='time'){
        if(draft.time){draft.time='';b.classList.remove('on');sheet.querySelector('#q_extra').innerHTML='';}
        else{draft.time='00:00';b.classList.add('on');sheet.querySelector('#q_extra').innerHTML=`<div class="label">Hora</div><input type="time" id="q_time" value="00:00">`;sheet.querySelector('#q_time').addEventListener('input',e=>draft.time=e.target.value);}
      } else if(opt==='checklist'){
        const extra=sheet.querySelector('#q_extra');
        if(draft.checklist.length){draft.checklist=[];b.classList.remove('on');extra.innerHTML='';}
        else{draft.checklist=[{text:'',done:false}];b.classList.add('on');renderQuickChecklist(sheet,draft);}
      }
    };
  });
  sheet.querySelector('#bCancel').onclick=closeSheet;
  sheet.querySelector('#bSave').onclick=()=>{
    const text=(ta.value||'').trim();
    const checklist=draft.checklist.filter(c=>c.text.trim());
    if(!text && !checklist.length){toast('Escribe algo');return;}
    addNote({
      title:text.split('\n')[0].slice(0,80), text,
      date: currentTab==='hoy'?currentDate:todayISO(),
      time:draft.time, label:draft.label, important:draft.important,
      hand:draft.hand, checklist
    });
    toast('✓ Guardado'); closeSheet();
  };
}
function renderQuickChecklist(sheet,draft){
  const extra=sheet.querySelector('#q_extra');
  const existing=extra.innerHTML;
  extra.innerHTML=existing+`
    <div class="label">Lista</div>
    <div id="q_cl"></div>
    <button class="moveopt" id="q_addItem" style="text-align:center;border-style:dashed">+ añadir punto</button>`;
  const cl=extra.querySelector('#q_cl');
  const renderItems=()=>{
    cl.innerHTML=draft.checklist.map((c,i)=>`
      <div class="row" style="margin-bottom:6px;align-items:center">
        <input type="text" data-idx="${i}" value="${escapeAttr(c.text)}" placeholder="Punto ${i+1}">
        <button class="moveopt" data-del="${i}" style="flex:0 0 auto;width:auto;padding:8px 12px;margin:0">✕</button>
      </div>
    `).join('');
    cl.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',e=>{draft.checklist[+inp.dataset.idx].text=e.target.value;}));
    cl.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{draft.checklist.splice(+b.dataset.del,1);renderItems();});
  };
  renderItems();
  extra.querySelector('#q_addItem').onclick=()=>{
    draft.checklist.push({text:'',done:false});renderItems();
    setTimeout(()=>{const inputs=cl.querySelectorAll('input');inputs[inputs.length-1]?.focus();},50);
  };
}
function openEditorFam(id,defaultDate){
  const editing=id?notes().find(n=>n.id===id):null;
  const note=editing||normalizeNote({date:defaultDate||todayISO()});
  openSheet(`
    <h3>${editing?'Editar recordatorio':'Nuevo recordatorio'} 🏠</h3>
    <div class="label">Tipo</div>
    <div class="cat-grid" id="famCatRow">
      ${CATEGORIAS_FAMILIA.map(c=>`<button type="button" class="cat-btn ${note.category===c.id?'on':''}" data-c="${c.id}"><span class="em">${c.emoji}</span> ${c.label}</button>`).join('')}
    </div>
    <div class="row">
      <div style="flex:1"><div class="label">Hora</div><input type="time" id="f_time" value="${note.time||''}"></div>
      <div style="flex:1"><div class="label">Fecha</div><input type="date" id="f_date" value="${note.date}"></div>
    </div>
    <div class="label">Título</div>
    <input type="text" id="f_title" placeholder="Ej: Tomar pastilla de la tensión" value="${escapeAttr(note.title)}" autocomplete="off">
    <div class="label">Detalle (opcional)</div>
    <textarea id="f_text" placeholder="Ej: 1 comprimido con agua durante el desayuno">${escapeHTML(note.text)}</textarea>
    <div class="label">Dosis (opcional)</div>
    <input type="text" id="f_dose" placeholder="Ej: 1 comprimido, 2 pastillas…" value="${escapeAttr(note.dose)}" autocomplete="off">
    <div class="label">Lugar (opcional)</div>
    <input type="text" id="f_place" placeholder="Ej: En casa, Centro de Salud…" value="${escapeAttr(note.place)}" autocomplete="off">
    <div class="label">Aviso recordatorio</div>
    <div class="chiprow" id="alertRow">
      <div class="chip ${note.alert===''?'on':''}" data-a="">Sin aviso</div>
      <div class="chip ${note.alert==='15 min antes'?'on':''}" data-a="15 min antes">15 min antes</div>
      <div class="chip ${note.alert==='30 min antes'?'on':''}" data-a="30 min antes">30 min antes</div>
      <div class="chip ${note.alert==='1 hora antes'?'on':''}" data-a="1 hora antes">1 hora antes</div>
    </div>
    <div class="chiprow" style="margin-top:4px">
      <div class="chip ${note.important?'on':''}" id="impChip">⭐ Importante</div>
    </div>
    <div class="actions">
      ${editing?`<button class="btn-ghost" id="bDel">Eliminar</button>`:''}
      <button class="btn-primary" id="bSave">Guardar</button>
    </div>
  `);
  const sheet=document.getElementById('sheet');
  const titleEl=sheet.querySelector('#f_title');
  setTimeout(()=>titleEl.focus(),150);
  let category=note.category||'', alert=note.alert||'', important=!!note.important;
  sheet.querySelectorAll('#famCatRow .cat-btn').forEach(b=>b.onclick=()=>{
    const val=b.dataset.c;
    if(category===val){category='';b.classList.remove('on');}
    else{category=val;sheet.querySelectorAll('#famCatRow .cat-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');}
  });
  sheet.querySelectorAll('#alertRow .chip').forEach(c=>c.onclick=()=>{
    alert=c.dataset.a;
    sheet.querySelectorAll('#alertRow .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
  });
  sheet.querySelector('#impChip').onclick=()=>{important=!important;sheet.querySelector('#impChip').classList.toggle('on',important);};
  sheet.querySelector('#bSave').onclick=()=>{
    const data={
      title:sheet.querySelector('#f_title').value.trim(),
      text:sheet.querySelector('#f_text').value.trim(),
      date:sheet.querySelector('#f_date').value||todayISO(),
      time:sheet.querySelector('#f_time').value||'',
      category, alert, important,
      place:sheet.querySelector('#f_place').value.trim(),
      dose:sheet.querySelector('#f_dose').value.trim()
    };
    if(!data.title&&!data.text){data.title=data.text;}
    if(!data.title&&!data.text){toast('Escribe algo');return;}
    if(editing){updateNote(id,data);toast('✓ Guardado');}
    else{addNote(data);toast('✓ Añadido');}
    closeSheet();
  };
  if(editing){sheet.querySelector('#bDel').onclick=()=>{if(confirm('¿Eliminar este recordatorio?')){deleteNote(id);closeSheet();toast('Eliminado');}};}
  titleEl.addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();sheet.querySelector('#bSave').click();}});
}
function openEditorCuad(id){
  const n=notes().find(x=>x.id===id);if(!n)return;
  openSheet(`
    <h3>Editar</h3>
    <textarea id="e_text" class="${n.hand?'hand':''}">${escapeHTML(n.text)}</textarea>
    <div class="label">Hora (opcional)</div>
    <input type="time" id="e_time" value="${n.time||''}">
    <div class="label">Fecha</div>
    <input type="date" id="e_date" value="${n.date}">
    <div class="label">Etiqueta</div>
    <div class="chiprow" id="e_label">
      <div class="chip ${n.label===''?'on':''}" data-v="">—</div>
      <div class="chip work ${n.label==='trabajo'?'on':''}" data-v="trabajo">📘 Trabajo</div>
      <div class="chip personal ${n.label==='personal'?'on':''}" data-v="personal">🟩 Personal</div>
    </div>
    <div class="chiprow">
      <div class="chip important ${n.important?'on':''}" id="e_imp">⭐ Importante</div>
      <div class="chip ${n.hand?'on':''}" id="e_hand">✍️ Manuscrita</div>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="eDel">Eliminar</button>
      <button class="btn-primary" id="eSave">Guardar</button>
    </div>
  `);
  const sheet=document.getElementById('sheet');
  const ta=sheet.querySelector('#e_text');
  setTimeout(()=>ta.focus(),120);
  let label=n.label||'', important=!!n.important, hand=!!n.hand;
  sheet.querySelectorAll('#e_label .chip').forEach(c=>c.onclick=()=>{
    label=c.dataset.v;
    sheet.querySelectorAll('#e_label .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
  });
  sheet.querySelector('#e_imp').onclick=()=>{important=!important;sheet.querySelector('#e_imp').classList.toggle('on',important);};
  sheet.querySelector('#e_hand').onclick=()=>{hand=!hand;sheet.querySelector('#e_hand').classList.toggle('on',hand);ta.classList.toggle('hand',hand);};
  sheet.querySelector('#eDel').onclick=()=>{if(confirm('¿Eliminar esta anotación?')){deleteNote(id);closeSheet();toast('Eliminada');}};
  sheet.querySelector('#eSave').onclick=()=>{
    updateNote(id,{
      text:ta.value.trim(),
      time:sheet.querySelector('#e_time').value||'',
      date:sheet.querySelector('#e_date').value||todayISO(),

    });

  };
}
function openNoteMenu(id){
  const n=notes().find(x=>x.id===id);if(!n)return;
  const esFam=state.currentNotebook==='familiar';
  openSheet(`
    <h3>${escapeHTML((n.title||n.text||'Anotación').slice(0,60))}</h3>
    <button class="moveopt" data-a="edit">✎ Editar</button>
    <button class="moveopt" data-a="move">📅 Mover a otra fecha…</button>
    <button class="moveopt" data-a="check">${n.done?'☐ Marcar como pendiente':'✓ Marcar como completada'}</button>
    <button class="moveopt" data-a="star">${n.important?'☆ Quitar de importantes':'⭐ Marcar como importante'}</button>
    <button class="moveopt" data-a="dup">⧉ Duplicar</button>
    <button class="moveopt" data-a="del" style="color:#c0392b">🗑 Eliminar</button>
    <div class="actions"><button class="btn-ghost" id="bClose">Cerrar</button></div>
  `);
  const sheet=document.getElementById('sheet');
  sheet.querySelector('#bClose').onclick=closeSheet;
  sheet.querySelectorAll('.moveopt').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='edit'){closeSheet();setTimeout(()=>{esFam?openEditorFam(id):openEditorCuad(id);},50);}
    else if(a==='move'){openMoveMenu(id);}
    else if(a==='check'){toggleDone(id);closeSheet();}
    else if(a==='star'){toggleImportant(id);closeSheet();}
    else if(a==='dup'){duplicateNote(id);closeSheet();}
    else if(a==='del'){if(confirm('¿Eliminar esta anotación?')){deleteNote(id);closeSheet();toast('Eliminada');}}
  });
}
function openMoveMenu(id){
  const n=notes().find(x=>x.id===id);if(!n)return;
  openSheet(`
    <h3>Mover a…</h3>
    <button class="moveopt" data-d="${todayISO()}">Hoy · ${fmtShort(todayISO())}</button>
    <button class="moveopt" data-d="${addDays(todayISO(),1)}">Mañana · ${fmtShort(addDays(todayISO(),1))}</button>
    <button class="moveopt" data-d="${nextWeekday(1)}">Próximo lunes · ${fmtShort(nextWeekday(1))}</button>
    <button class="moveopt" data-d="${addDays(todayISO(),7)}">En una semana · ${fmtShort(addDays(todayISO(),7))}</button>
    <div class="label" style="margin-top:10px">Elegir fecha</div>
    <input type="date" id="m_date" value="${n.date}">
    <div class="actions">
      <button class="btn-ghost" id="bClose">Cancelar</button>
      <button class="btn-primary" id="bDate">Mover</button>
    </div>
  `);
  const sheet=document.getElementById('sheet');
  sheet.querySelector('#bClose').onclick=closeSheet;
  sheet.querySelectorAll('.moveopt').forEach(b=>b.onclick=()=>{moveNote(id,b.dataset.d);closeSheet();});
  sheet.querySelector('#bDate').onclick=()=>{
    const d=sheet.querySelector('#m_date').value;
    if(!d)return;moveNote(id,d);closeSheet();
  };
}
function openSettings(){
  openSheet(`
    <h3>Ajustes</h3>
    <div class="label">Cuaderno actual</div>
    <div class="chiprow" id="setNbRow">
      <div class="chip ${state.currentNotebook==='trabajo'?'on':''}" data-nb="trabajo">✍️ Cuaderno</div>
      <div class="chip ${state.currentNotebook==='familiar'?'on':''}" data-nb="familiar">🏠 Familia</div>
    </div>
    <div class="label">Nombre para el saludo familiar</div>
    <input type="text" id="famNameInput" placeholder="Ej: mamá, papá, Carmen…" value="${escapeAttr(state.famName)}" autocomplete="off">
    <small style="display:block;color:var(--ink-soft);font-size:12px;margin:-6px 4px 8px">
      Aparecerá en el saludo: "Buenos días, mamá".
    </small>
    <div class="label">Apariencia</div>
    <div class="opt" id="optTheme">
      <div>Modo oscuro<small>Cambia el aspecto del cuaderno</small></div>
      <div class="switch ${state.theme==='dark'?'on':''}"></div>
    </div>
    <div class="label" style="margin-top:16px">Copia de seguridad</div>
    <div class="opt" id="optExport">
      <div>Exportar copia de seguridad<small>Descarga un archivo .json con todo</small></div>
      <div>⤓</div>
    </div>
    <div class="opt" id="optImport">
      <div>Importar copia de seguridad<small>Reemplaza los datos actuales</small></div>
      <div>⤒</div>
    </div>
    <div class="label" style="margin-top:16px">Datos</div>
    <div class="opt" id="optWipeAll">
      <div style="color:#c0392b">Borrar TODOS los datos<small>Los dos cuadernos. No se puede deshacer</small></div>
      <div style="color:#c0392b">🗑</div>
    </div>
    <div class="actions"><button class="btn-ghost" id="bClose">Cerrar</button></div>
  `);
  const sheet=document.getElementById('sheet');
  sheet.querySelector('#bClose').onclick=closeSheet;
  sheet.querySelectorAll('#setNbRow .chip').forEach(c=>c.onclick=()=>{switchNotebook(c.dataset.nb);closeSheet();});
  const nameInput=sheet.querySelector('#famNameInput');
  nameInput.addEventListener('input',()=>{state.famName=nameInput.value.trim();localStorage.setItem(NAME_KEY,state.famName);});
  sheet.querySelector('#optTheme').onclick=()=>{toggleTheme();openSettings();};
  sheet.querySelector('#optExport').onclick=exportBackup;
  sheet.querySelector('#optImport').onclick=importBackup;
  sheet.querySelector('#optWipeAll').onclick=()=>{
    if(confirm('¿Borrar TODOS los datos de los dos cuadernos?')){
      if(confirm('Confirma otra vez: se eliminará todo.')){
        state.notebooks.trabajo.notes=[];
        state.notebooks.familiar.notes=[];
        save();closeSheet();render();toast('Datos borrados');
      }
    }
  };
}
function exportBackup(){
  const data={app:'cuaderno',version:5,exportedAt:new Date().toISOString(),notebooks:state.notebooks,famName:state.famName};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const ts=new Date().toISOString().slice(0,10);
  a.href=url;a.download=`cuaderno-backup-${ts}.json`;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url); toast('Copia exportada');
}
function importBackup(){
  const input=document.createElement('input');
  input.type='file';input.accept='application/json,.json';
  input.onchange=()=>{
    const f=input.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const parsed=JSON.parse(reader.result);
        let trabajo=[],familiar=[];
        if(parsed.notebooks){
          trabajo=Array.isArray(parsed.notebooks.trabajo?.notes)?parsed.notebooks.trabajo.notes:[];
          familiar=Array.isArray(parsed.notebooks.familiar?.notes)?parsed.notebooks.familiar.notes:[];
        } else if(Array.isArray(parsed.notes)){trabajo=parsed.notes;}
        else if(Array.isArray(parsed)){trabajo=parsed;}
        const, clean=(arr)=>arr.filter(n=>n&&typeof n==='object'&&typeof n.date==='string').map(normalizeNote);
        const t=clean(trabajo),fam=clean(familiar);
        if(!confirm(`Se importarán ${t.length+fam.length} anotaciones (${t.length} cuaderno, ${fam.length} familia). ¿Continuar?`))return;
        state.notebooks.trabajo.notes=t;
        state.notebooks.familiar.notes=fam;
        if(parsed.famName){state.famName=String(parsed.famName);localStorage.setItem(NAME_KEY,state.famName);}
        save();closeSheet();render();toast('Importado');
      }catch(err){alert('No se pudo leer el archivo: '+err.message);}
    };
    reader.readAsText(f);
  };
  input.click();
}
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return escapeHTML(s);}
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape') closeSheet();
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='ArrowLeft'&&currentTab==='hoy'){currentDate=addDays(currentDate,-1);render();}
  if(e.key==='ArrowRight'&&currentTab==='hoy'){currentDate=addDays(currentDate,1);render();}
  if(e.key==='n'||e.key==='N'){openQuickWrite();}
});
applyTheme();
load();
render();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
